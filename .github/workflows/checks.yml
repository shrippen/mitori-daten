name: Checks

# The checks of every commit:
#   generated YAML up to date (daten/shinki-toho-kommentare.yaml, daten/lexikon.yaml)
#   Datenformat (tools/daten.py, pytest für daten, Bundle, Shinki)
#   Ein Tag v<Stand> passt zur Datei STAND
# Local only: tools/kapitel.py und das Packen echter Bundles (brauchen die Videos).
#
# Arch Linux container: same as on the developer machine.

# Public mirror: Gitea pushes every branch and tag here on each commit.
# This runs the checks and reports them back to the commit on Gitea as
# the status "github / test". There are no pull requests on GitHub, so
# everything runs on push.
#
# Needs the secret GITEA_TOKEN: a Gitea token with write access to the
# repository (commit statuses).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# No concurrency group: every commit runs to the end and keeps its own
# status, a newer push does not cancel an older run.

env:
  GITEA_STATUS: https://git.arianw.de/api/v1/repos/shrippen/mitori-daten/statuses/${{ github.sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  test:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    outputs:
      started: ${{ steps.start.outputs.t }}
    steps:
      # A missing status is no reason to fail the checks.
      - id: start
        name: Report pending to Gitea
        run: |
          echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"context\":\"github / test\",\"description\":\"running\",\"target_url\":\"$RUN_URL\"}" \
            || echo "::warning::Gitea status not reported"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}

      - name: Install Python, PyNaCl, poppler
        run: |
          pacman -Syu --noconfirm --needed git python python-yaml python-pytest python-pynacl \
            poppler poppler-data

      - uses: actions/checkout@v7

      - name: Daten-Tests
        run: python3 -m pytest -q tests

      # daten.py ist die Validierung: prüft IDs, Felder, Kanji-IDs in KORREKTUREN.md,
      # Wartezeiten je Grad. Läuft bei jedem Push.
      - name: Programme data
        run: python3 tools/daten.py

      # daten/shinki-toho-kommentare.yaml und daten/lexikon.yaml kommen aus den
      # PDFs (poppler-data: die CJK-Tabellen, die pdftotext für die japanische
      # Spalte braucht). Eine Hand-Änderung oder ein geändertes Werkzeug ohne
      # neuen Lauf fällt hier auf.
      - name: Generated data up to date
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/kommentare.py > /dev/null
          python3 tools/lexikon.py > /dev/null
          git diff --exit-code -- daten/

      # App und Heft zeigen STAND an; sie pinnen das Tag v<Stand>.
      - name: Tag matches STAND
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(cat STAND)"

  # Also runs when a check failed or was cancelled, so Gitea never keeps a
  # stale "pending". Success only when all checks passed.
  report:
    needs: [test]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Report result to Gitea
        run: |
          state=success
          for r in $RESULTS; do
            case "$r" in
              success) ;;
              failure) state=failure ;;
              *) [ "$state" = failure ] || state=error ;;
            esac
          done
          desc=$state
          if [ -n "$STARTED" ]; then desc="$state in $(( ($(date +%s) - STARTED) / 60 )) min"; fi
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github / test\",\"description\":\"$desc\",\"target_url\":\"$RUN_URL\"}"
        env:
          RESULTS: ${{ needs.test.result }}
          STARTED: ${{ needs.test.outputs.started }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
