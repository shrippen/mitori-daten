- de: Lexikon der Aiki-Budo-Begriffe, Japanisch–Deutsch, shinkiryu.de, Stand 20. März 2018
  en: Lexicon of Aiki-Budo terms, Japanese–German, shinkiryu.de, as of 20 March 2018
- de: Aikido-Techniken müssen kampfwirksam sein, damit man bei ihrer Ausführung nicht einer Selbsttäuschung erliegt.
    Das Ziel ist zwar nicht, unbedingt gewinnen zu wollen, aber es gehört doch zur Selbstschulung, wenn man soweit
    als möglich nach der Wirksamkeit der Techniken strebt.
  en: Aikido techniques must be effective in combat, so that one does not fall prey to self-deception when performing
    them. The goal is not to want to win at all costs, but it does belong to self-training to strive as far as possible
    for the effectiveness of the techniques.
- de: Die Bewegung muss aber natürlich bleiben, was dadurch gewährleistet wird, dass man sich vom Bauch als der
    Mitte des Körpers her bewegt (Hara-Prinzip), während die Gliedmaßen, besonders die Arme, locker bewegt werden.
    Bildlich gesprochen, soll die Bewegung wie Bambus oder wie eine Weide im Wind sein.
  en: The movement must nevertheless remain natural, which is ensured by moving from the belly as the centre of
    the body (Hara principle), while the limbs, especially the arms, are moved loosely. Figuratively speaking, the
    movement should be like bamboo or a willow in the wind.
- de: Die Durchführung der Aikido-Techniken sollte schließlich von Ki (= Urlebenskraft) beseelt sein. Was eigentlich
    in allen Budo-Arten – und sogar in allen guten Bewegungskünsten – gilt, ist im Ki-Budo, also auch im Aikido,
    besonders wichtig. Die weiche Bewegung muss einen Kern haben. Es geht nicht hauptsächlich um den gewollt explosionsartigen
    Ki-Ausbruch, sondern um das Ausströmen des Ki, was durch intensiv-hingebungsvolles Üben in uns entsteht. Schlussendlich
    sollen wir uns gegenüber dem Shinki (göttlichen Ki) öffnen.
  en: Finally, the performance of aikido techniques should be animated by Ki (= primal life force). What actually
    holds true in all kinds of Budo – and even in all good arts of movement – is especially important in Ki-Budo,
    and thus also in aikido. The soft movement must have a core. It is not mainly about the deliberately explosive
    outburst of Ki, but about the outflow of Ki, which arises in us through intensive and devoted practice. Ultimately
    we should open ourselves to Shinki (divine Ki).
- de: Zu Anfang ist es besonders wichtig, dass man nicht auf eine Vielzahl von Techniken aus ist, sondern wenige
    Grundtechniken gut beherrscht. Eine Haltung, der es darum geht, sich möglichst schnell viele Techniken anzueignen
    und dadurch zügig zu höheren Graden kommen zu wollen, passt nicht zu den Prinzipien des Shinkiryu Aiki Budo
    / Aikido Shinki Rengo.
  en: At the beginning it is especially important not to be after a multitude of techniques, but to master a few
    basic techniques well. An attitude that is concerned with acquiring many techniques as quickly as possible,
    and thereby wanting to reach higher grades swiftly, does not fit the principles of Shinkiryu Aiki Budo / Aikido
    Shinki Rengo.
- de: Zunächst sollen eine standfeste Grundhaltung und sichere Schritte (Sabaki) erlangt werden. Sodann soll gelernt
    werden, den Abstand (Maai) zum Angreifer (Seme oder Uke als Partner in der Angreiferrolle) abzuschätzen sowie
    auch das Timing beim Einsatz der Technik. Mit der Zeit sollen die Bewegungen immer fließender und die Details
    der Technik immer genauer werden. Auch die Zahl der Techniken muss kontinuierlich steigen, damit Schmalspurigkeit
    vermieden wird. Die Prüfungen zu höheren Graden setzen auch die Techniken der niedrigeren Grade voraus. Deswegen
    werden bei Prüfungen immer Stichproben von Techniken unterhalb des eigentlich zu prüfenden Grades gemacht.
  en: First, a stable basic posture and sure steps (Sabaki) should be attained. Next, one should learn to judge
    the distance (Maai) to the attacker (Seme, or Uke as the partner in the attacker's role) as well as the timing
    in applying the technique. Over time, the movements should become ever more flowing and the details of the technique
    ever more precise. The number of techniques must also rise continuously, so that narrowness is avoided. Examinations
    for higher grades also presuppose the techniques of the lower grades. For this reason, examinations always include
    samples of techniques below the grade actually being examined.
- de: Es ist darauf zu achten, dass die Technik nicht wild, grob und hektisch, sondern genau, weich und dynamisch
    durchgeführt wird. Mit der Zeit soll dann die wahre, beherrschte Schärfe der Technik gefördert werden. Bei der
    Übung sollte man immer auf den Partner / die Partnerin je nach dem Fortschrittsgrad, der körperlichen Beschaffenheit,
    dem Alter usw. Rücksicht nehmen.
  en: Care must be taken that the technique is performed not wildly, roughly and hectically, but precisely, softly
    and dynamically. Over time, the true, controlled sharpness of the technique should then be cultivated. In practice
    one should always show consideration for the partner according to their level of progress, physical condition,
    age and so on.
- de: Bei der Dan-Graduierung werden darüber hinaus die Beherrschung des Ki, die meditative innere Haltung in Schlichtheit,
    Bescheidenheit und Unverzagtheit des Herzens und das Engagement für Aikido im Allgemeinen und für Aikido Shinki
    Rengo im Besonderen berücksichtigt.
  en: For Dan grading, the mastery of Ki, the meditative inner attitude in simplicity, modesty and undaunted heart,
    and the commitment to aikido in general and to Aikido Shinki Rengo in particular are also taken into account.
- de: Zur Dan-Graduierung gehört auch, dass man nicht nur selber gut Techniken beherrscht, sondern auch anderen
    zur Entwicklung verhelfen und sie gut beurteilen kann. Dies ist eben die Voraussetzung, dass die Dan-Graduierung
    zugleich zur selbständigen Graduierungsbefugnis führt.
  en: Dan grading also requires that one not only masters techniques well oneself, but can also help others to develop
    and assess them well. This is precisely the condition for Dan grading also leading to the independent authority
    to award grades.
