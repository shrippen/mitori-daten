# Daitoryu: Bausteine für die Kanji der Technik- und Angriffsnamen.
#
# UNGEPRÜFT (KORREKTUREN.md, D-X-01). Die Prüfungsprogramme enthalten keine
# Kanji. tools/daten.py zerlegt einen Namen an den Bindestrichen und sucht von links
# die längste passende Folge ("Shômen-uchi" vor "Shômen" + "uchi"). Fehlt ein
# Baustein, bleibt das Kanji leer und der Name landet in
# build/daten/fehlende-kanji.txt.
#
# Schlüssel klein, ohne Längenzeichen, Teile mit Bindestrich.
