kiriotoshi: '斬り落し


  Das Verb kiriotosu bedeutet hinunter schneiden. Kiriotoshi ist die Nomenbildung des Verbs. Um das große Kiriotoshi,
  das im Shinki-Toho oft vorkommt, gut zu meistern, gibt es eine Grundübung namens Kiriotoshi.


  Uchidachi (U) 打 太 刀 : In 陰


  Shidachi (S) 仕 太 刀 :


  Seigan 正 眼


  In Isshoku-Sokuhatsu-no-Maai eintretend hebt U sein Schwert hoch und schlägt, wahlweise entweder mit dem linken
  oder dem rechten Fuß vorne, das Shomen von S. S hebt ebenfalls sein Schwert und schlägt - unbeeindruckt vom Schlag
  des U – mit dem rechten Fuß vorne über das Schwert in die Mitte des U.


  Isshoku-Sokuhatsu heißt der höchst angespannte Moment der Begegnung kurz vor der "Explosion": nur noch eine kleine
  Bewegung - und Angriff und Verteidigung kommen sofort zur Ausführung. "Isshoku" bedeutet "eine Berührung", "Sokuhatsu"
  ist "eine sofortige Explosion". Mit dem Ausdruck beschreibt man eine angespannte Situation "vor dem Sturm". "Maai"
  ist der Abstand. Shomen ist eigentlich das vordere Gesicht, die Frontseite des Gesichts. Gemeint ist im Zusammenhang
  des Schwertkampfs ein gerader Schlag von oben über den Kopf. Shomen kann im allgemeinen auch die Frontseite bedeuten,
  z.B. die Frontseite des Dojos. Hierbei gibt es 3 Varianten:


  Shin 真 : S schlägt bis zum Mizoochi (Solarplexus) des U hinunter.


  Gyo 行 : Beide kommen etwas schneller aufeinander zu und S schlägt bis zum Hals des U. So 草 : Beide kommen sehr
  schnell aufeinander zu und S schlägt auf den Kopf des U zu. Shin, Gyo, So sind eigentlich drei Schreibweisen des
  chinesischen Zeichens. Shin ist die Druckschrift, Gyo ist die etwas fließendere Schreibweise, So ist eine ganz
  freie, kunstvolle Schreibweise. Diese Ausdrücke wurden auf die Bewegungsarten des Schwertes übertragen. Im Fall
  von Shin und Gyo kann man die Bewegung weiterführen: U gleitet mit dem hinteren Fuß zurück und hebt sein Schwert
  zu Hidari- oder Migi-Jodan. S folgt mit zwei Schritten (links - rechts) und schlägt das Hidari- oder Migi-gote
  des U (die Seite des vorderen Fußes des U), geht zwei Schritte (rechts - links) zurück und wechselt zu Gedan.
  Auch U senkt sein Schwert zu Gedan (Gedan- Awase). Beide (erst U dann S) kippen ihre Schwerter nach rechts (die
  Schneiden liegen gegeneinander) und senken die Schwerter nach rechts unten. Mit dem linken Fuß beginnend gehen
  sie zurück zur Ausgangsposition.


  Sun-dome 寸 止 め : Wenn man ohne Onigote übt, muss S den entscheidenden Schlag 3 cm oberhalb des eigentlichen Ziels
  stoppen. Ein Sun ist ca. 3 cm. Das Verb "tomeru" bedeutet "stoppen".'
kumidachi: 'Kumidachi sind Übungsformen zu zweit, in denen typische Kampfsituationen wiederholt und langsam geübt
  werden. Ziel der Kumidachi ist aber nicht nur das Üben der Techniken in typischen Kampfsituationen, sondern wieder
  die Förderung des Ki. Deswegen sollen die Übungen nicht hektisch durchgeführt werden, auch wenn manch schnelle
  Bewegungen enthalten sind. Derjenige, der die Angreiferrolle übernimmt, heißt Uchi-dachi (abgekürzt "U": das schlagende
  Schwert). Derjenige, der dem Angriff entgegentritt und gewinnt, heißt Shi-dachi (abgekürzt "S": das agierende
  Schwert, das Haupt-Schwert).


  Eigentlich ist U der Lehrer, und S der Schüler. Wenn U und S etwa auf gleichem Niveau stehen und sie wechselseitig
  sowohl die U-Seite als auch die S-Seite üben, muss U sich immer dessen bewusst sein, dass er eigentlich die Lehrerrolle
  spielt. Das heißt, U muss immer versuchen, eine gute Angreiferrolle zu spielen, damit S sich ernsthaft dem Angriff
  stellen muss und dadurch seine Schwertkunst verbessert wird. Bei allen Bewegungen ergreift U die Initiative und
  fängt an. S folgt sofort. Es kommt auch vor, dass ein Fortgeschrittener gegenüber einem Nicht-Fortgeschrittenen
  die Shidachi -Rolle übernimmt. In diesem Fall versucht der erstere die Uchidachi-Kunst des letzteren zu erhöhen.


  Kumidachi im Shinki Toho besteht aus verschiedenen Waffenkombinationen:


  Ô-dachi tai Ô-dachi: U mit Ô-dachi, S mit Ô-dachi

  Ko-dachi tai Ô-dachi: U mit Ô-dachi, S mit Ko-dachi

  Tanto tai Ô-dachi: U mit Ô-dachi, S mit Tanto

  Muto tai Ô-dachi: U mit Ô-dachi, S ohne Waffen

  Muto tai Ko-dachi: U mit Ko-dachi, S ohne Waffen

  Muto tai Tanto: U mit Tanto, S ohne Waffen


  ## Rei-ho 礼法 (Begrüßungsform) zu Beginn


  Alle Schüler sitzen in einer Reihe gegenüber dem Kamiza. Der Lehrer sitzt vorne, aber etwas seitlich und nicht
  auf der mittleren Linie vor dem Kamiza. Die Schüler sollen möglichst direkte Sicht zum Kamiza haben. Wenn nur
  wenige Übungsteilnehmer anwesend sind, verbeugt sich zuerst wortlos der Übungsleiter/Lehrer zum Kamiza; die anderen
  folgen. Danach wendet sich der Lehrer den Schülern zu. Der Lehrer und die Schüler verbeugen sich gegenseitig mit
  den Worten "Onegai shimasu" ("Ich bitte um das Training"). Wenn viele Teilnehmer da sind, sagt zuerst der Schüler,
  der ganz rechts sitzt, "Kamiza ni Rei", und alle verbeugen sich gegenüber dem Kamiza. Danach wendet sich der Lehrer
  den Schülern zu und Lehrer und Schüler verbeugen sich gegenseitig mit den Worten "Onegai shimasu". (Kamiza 上座
  ist die Frontseite, wo ein Platz für das "Höhere" eingeräumt ist. "Kamiza" bedeutet etwa "der Sitz für den Höheren"
  oder "der höhere Sitz". Normalerweise wird dieser Platz durch eine Kalligraphie, ein Photo oder/und Blumen hervorgehoben.
  Da Kami phonetisch auch Gott bedeutet, kann man den Höheren für göttlich halten.)


  Wenn das Kumidachi beginnt, stehen Uchidachi und Shidachi einander mit weitem Abstand (wenn möglich mindestens
  6 m Abstand) gegenüber. U trägt Onigote unter der linken Achsel (die rechte Hand des Onigote unten), wobei die
  Fingerseite nach vorne zeigt und die Handrücken nach außen. U und S tragen das Schwert mit der linken Hand. Die
  Schwertspitze (= "Kissaki") richtet sich (mit der Schneide nach oben) nach hinten und zeigt schräg nach unten,
  und zwar beim Shidachi etwas mehr, weil er die Onigote nicht halten muss. Weil das Schwert nach unten weist, muss
  der Daumen die Tsuba nicht festhalten, kann aber leicht darauf gelegt werden. Beide verbeugen sich (etwa 30 Grad)
  mit geradem Oberkörper. Dabei darf der Kopf nicht nach unten gebeugt werden; der Blick geht folglich auch nicht
  zu den eigenen Füßen, sondern schräg nach vorne. Umgekehrt sollte man aber auch das Gesicht nicht heben und den
  Partner anschauen.


  (Onigote 鬼篭手: "Kote" ist ursprünglich die Außenseite des Unterarms, ist aber auch ein stabiler Schutz-Handschuh
  des Samurai, der fast den ganzen Unterarm schützt, ohne die Bewegungsfreiheit des Ellbogens zu beeinträchtigen.
  "Oni" ist ursprünglich ein muskulöser Teufel, aber man verwendet diesen Ausdruck auch im Sinne von "extra-groß"
  oder "extra-stark". Man hat den dick gepolsterten Kote erfunden, damit man mit dem Bokuto ( = Bokken: Holzschwert)
  richtig zuschlagen kann. Aus hygienischen Gründen sollte idealerweise jeder ein eigenes Onigote-Paar besitzen.
  Da dies aber sehr kostspielig sind, werden sie oft gemeinsam verwendet. In diesem Fall sollte man je eigene dünne
  baumwollene Handschuhe unter dem Onigote tragen. Tsuba 鍔: "Tsuba" ist das Stichblatt der japanischen Schwerter
  für den Schutz der Hände. Es bestand ursprünglich aus Metall und war kunstvoll verziert. Das Tsuba des Ittoryu-Bokuto
  besteht aus gehärtetem Leder, seit einiger Zeit auch aus einem speziellem Kunststoff.)


  Anschließend stehen beide wieder aufrecht. Nun wird das Kissaki erhoben, so dass das Schwert zu Boden horizontal
  liegt. Hier berührt der linke Daumen den oberen Teil und der Zeigefinger den unteren Teil des Tsuba. Das Tsukagashira
  (= Griffkopf) befindet sich vor der Körpermitte, so dass das Kissaki etwas nach außen zeigt. Beide gehen nun gleichzeitig,
  mit dem rechten Fuß beginnend, zur Mitte hin vor und ziehen dabei das Schwert, das in direkter Bewegung zu Ai-Gedan
  (= U und S beide Gedan) geführt wird, wobei die Schwertspitzen etwa 9 cm (alte jap. Maßeinheit: 3 Sun) parallel
  zueinander stehen, während die Schneiden nach unten zeigen ("Gedan-Awase" = beide Schwerter zu Gedan zusammenführen).
  Dies bedeutet, dass die beiden Schwertspitzen etwa 4,5 cm über die Mittellinie hinaus ragen. U hält das Schwert
  mit der rechten Hand allein (wenn ohne Onigote, dann mit beiden Händen), S mit beiden Händen. U und S drehen das
  Schwert nun in eine waagerechte Position, wobei die beiden Schneiden einander gegenüber liegen. Shidachi löst
  seine linke Hand vom Schwert, und beide knien nun zuerst mit dem linken Bein ab, während zuerst das Kissaki gesenkt
  und auf den Boden aufgesetzt wird. Bei der gesamten Bewegung bleiben die Schwerter in Kontakt mit einander und
  werden dann parallel am Boden gerade vor den Kämpfern abgelegt, während zugleich auch das rechte Bein abkniet.


  U legt seine Onigote rechts und links (in dieser Reihenfolge) vom eigenen Schwert ab, wobei die Onigote-Vorderteile
  schräg (ca. 90° zu einander bzw. 135°zum Schwert) und direkt an der Tsuba angelegt werden. Beide verbeugen sich,
  wobei zuerst die rechte und dann die linke Hand auf den Boden geführt wird. Die beiden Zeigefinger und Daumen
  bilden ein Dreieck (die Daumenspitzen berühren sich gerade). Diese Verbeugung ist tief, und die Nase steht oberhalb
  des Dreiecks, aber der Blick soll vorne außerhalb des Dreiecks sein, d.h. man darf den Kopf nicht hängen lassen.
  Zuerst hebt U seinen Kopf, bis die Arme gerade gestreckt werden, aber die Hände bleiben noch auf dem Boden. Danach
  hebt auch S den Kopf in der gleichen Weise wie U, und die beiden schauen sich einen kurzen Moment in die Augen.
  Wieder von U beginnend zieht man erst die linke und dann die rechte Hand zurück auf den Schoß. Während U die Onigote
  anzieht (rechts zuerst) wartet S. Dann ergreifen beide mit der linken Hand das Schwert von oben. Der kleine Finger
  liegt am Rand des Schwertgriffs ("Tsuka-gashira"). Jetzt steht man mit dem linken Bein zuerst auf und danach mit
  dem rechten, wobei man versucht, sich möglichst nicht nach vorne zu bewegen, sondern am Platz zu bleiben. Das
  Schwert wird dann in weiterhin paralleler Ausrichtung ("Schneide zu Schneide") bis Gedan erhoben. Dabei ergreift
  auch die rechte Hand das Schwert. Mit dem linken Fuß beginnend geht man zurück zur Ausgangsposition, wobei die
  Schwerter horizontal gehalten werden. (Tsuka-gashira 柄頭: "Tsuka" ist der Griff des Schwertes, "Kashira" ist der
  Kopf. Also ist der Tsuka-gashira der Kopfteil des Schwertgriffs, d.h. das dem Kissaki = Schwertspitze entgegen
  gesetzte Ende.)


  An der Ausgangsposition angekommen, lösen beide die rechte Hand vom Schwert und senken das Kissaki, aber so, dass
  es vorne und in der Körpermitte bleibt. Danach gehen beide zu Seigan über, wobei U mit der Bewegung beginnt. Danach
  beginnt das einzelne Kumidachi.


  ## Rei-ho 礼法 (Begrüßungsform) am Ende


  In der Startposition hält man das Schwert auf der linken Seite (Spitze vorne vor der Körpermitte), verbeugt sich,
  geht in die Mitte und hebt das Kissaki zu Gedan-Awase. Dann folgt der gleiche Vorgang wie zu Beginn. U legt nach
  dem Abknien die Onigote wie am Anfang rechts und links ab. Beide verbeugen sich. Danach zieht U beide Onigote
  etwas zu sich, ergreift mit der rechten Hand die Daumen der beiden Onigote, wobei der Zeigefinger zwischen sie
  kommt, und führt die Onigote unter die linke Achsel (rechtes Onigote unten, Fingerteil vorne). U drückt das Tsuka
  mit der rechten Hand leicht nach unten, so dass das Kissaki etwas erhoben wird, damit S sein Kissaki darunter
  hindurch nach links führen kann. Dann führt er das Bokuto auf die linke Seite, um es mit der linken Hand zu übernehmen.
  Dabei wird das Bokuto gewendet, damit die Schneide nach oben kommt. Das Tsukagashira von U und S ist bei dieser
  Bewegung vorne in der Körpermitte. Beide erheben sich nun, wobei diesmal das rechte Bein beginnt, und stehen mit
  dem rechten Bein vorne im Gegensatz zum Anfang. Mit dem linken Fuß beginnend gehen sie zurück bis zur Startposition,
  wobei das Schwert auf Gürtelhöhe angehoben bleibt. An der Startposition angekommen lassen beide ihre Schwerter
  sinken wie zu Beginn und verbeugen sich.


  ## Anfang des Kumidachi und Ansage


  Nach der kurzen Vorbeugung ziehen U und S ihre Schwerter und stehen in Seigan (Ai-Seigan). Dann sagt U die kommende
  Technik an. Am Anfang jedes Grades wird auch unsere Stilrichtung und anschließend der Grad genannt: (z.B. Itto-den
  Shinki Toho, Shoden). Danach wird die jeweilige Technik genannt (z.B. O-dachi Ippon-me Hitotsugachi). Während
  der Ansage des technischen Teils geht U von Seigan zum Start-Kamae der jeweiligen Nummer über (z.B. beim Ippon-me
  von Seigan zu In).'
suburi:
- nr: 1
  titel: Shomen-Uchioroshi ("Frontales Abwärtsschlagen")
  text: Man steht, die Füße etwas mehr als hüftbreit nebeneinander und parallel nach vorne. Die Füße bewegen sich
    bei der Übung nicht. Die Knie sind nicht ganz durchgestreckt, sondern ein wenig gebeugt. Man hebt das Schwert
    zum Ausholen hoch über den Kopf. Die Neigung des Schwertes kann man variieren, aber man soll hauptsächlich mit
    einem Winkel von 45 Grad üben. Arme und Schultern sollen auf jeden Fall locker bleiben. Dann schwingt man das
    Schwert ganz gerade hinunter, während man in beiden Knien locker federt. Das Schwert stoppt vor dem Bauch in
    horizontaler Position. Man sollte darauf achten, dass die Hände nicht früher unten ankommen als die Schwertspitze
    (Kissaki), sondern man muss das Kissaki in einer großen Kreisbewegung so nach unten führen, dass das Kissaki
    und die Hände etwa gleichzeitig in die Höhe des Bauchs kommen, wo die Schlagbewegung endet. Das Ki sollte hauptsächlich
    auf das Kissaki gelegt werden. Diese Übung kann man auch mit einem Gegenstand wie einem alten Reifen oder einem
    Reisigbündel vor sich durchführen (richtig hineinschlagen).
- nr: 2
  titel: Shomen-Uchikomi ("Frontales Hineinschlagen")
  text: 'Man steht in In no Kamae. Mit dem rechten Fuß einen Schritt vorgehend hebt man das Schwert über den Kopf
    (Neigung nach hinten 45 Grad) und schlägt in einem großen Bogen nach vorne, während der linke Fuß bis zur Ferse
    des rechten Fußes nachgezogen wird. Der linke Fuß soll dabei möglichst geradeaus gerichtet bleiben und die Fußspitze
    soll nicht nach links außen gedreht werden. Auch hierbei sollte man das Bewusstsein haben, dass das Kissaki
    einen großen Kreis beschreibt (und nicht die Hände einen kleinen Kreis). Die Endstellung des Kissaki liegt etwa
    in der Höhe des eigenen Kinns.


    Mit dem linken Fuß zurücktretend wechselt man zu Yo no Kamae, wobei der rechte Fuß etwa bis zu den Zehenspitzen
    des linken Fußes nachgezogen wird. Diesmal geht man dann mit dem linken Fuß nach vorne, während man das Schwert
    über den Kopf hochhebt und anschließend wie oben schlägt. Der rechte Fuß wird nachgezogen. Auch hier sollte
    man darauf achten, dass der nachgezogene rechte Fuß möglichst geradeaus gerichtet bleibt. Dann geht man mit
    dem rechten Fuß beginnend zurück und wechselt zu In no Kamae wie zuvor.'
- nr: 3
  titel: Te no Uchi ("Zwischen-die-Unterarme-Hineinschlagen")
  text: 'Mae (vorne): Man steht in In no Kamae. Mit dem rechten Fuß geht man einen Schritt nach vorne rechts und
    schlägt in die Mitte der Ausgangsposition, wobei der linke Fuß zur Ferse des rechten Fußes hin nachgezogen wird.
    In diesem Fall weist die Spitze des linken Fußes etwas nach links. Der Schlag kommt von In no Kamae direkt durch
    die Handgelenke ohne das Schwert hochzuheben. Die Absicht des Schlags besteht darin, den linken Kote (Unterarm)
    des Angreifers zu schneiden, der mit dem Tsuki (gerader Stoß) nach vorn kommt. Der schneidende Schlag kommt
    von oben nach unten, und nicht schräg. Der Endpunkt des Kissaki ist etwas tiefer als das gedachte entgegen gestreckte
    Kote. Das Tsuki ist auch der Grund, warum man etwas nach rechts ausweicht.


    Danach kommt man, mit dem linken Fuß anfangend und den rechten nachziehend, in die Mitte zurück und wechselt
    zu Yo no Kamae. Anschließend geht man mit dem linken Fuß nach links vorne und schlägt das rechte Kote des gedachten
    Gegners, wobei der rechte Fuß nachgezogen wird. Danach kommt man wieder in die Mitte zu In no Kamae zurück und
    beginnt die Übung von vorne.


    Oku (hinten): Fast die gleiche Bewegung, aber hier hebt man das Schwert hoch und schneidet das hintere Kote
    von innen. Der Schnitt ist in diesem Fall schräg. Wenn man von Yo no Kamae aus schneidet, kann man eigentlich
    den hinteren (= linken) Arm des Angreifers nicht erreichen, wenn er üblicherweise mit der linken Hand die Nähe
    des Tsukagashira greift und mit der rechten Hand die Nähe des Tsuba. Aber man übt auch diese Seite, damit die
    Bewegungen beider Seiten gleichermaßen trainiert werden. Außerdem ist diese Übung für das unübliche Kesagake
    von links geeignet.'
kamae:
- nr: 1
  titel: Rei
  kamae:
  - 0
  text: Man steht mit Shizentai (natürlicher Körperhaltung). Die Füße stehen leicht auseinander etwa schulterbreit
    geöffnet. Tachi trägt man mit der linken Hand an der linken Körperseite. Die Schneide nach oben, die Spitze
    entspannt hängen lassen. Der Griff der linken Hand ist direkt unterhalb des Tsuba (Handschutz), dieses berührend.
    Das Tsuba kann ganz frei sein, weil in dieser Lage selbst das wirkliche Schwert nicht herausgleiten kann. Aber
    man kann den Daumen leicht über das Tsuba legen. Mit dieser Haltung beugt man den Oberkörper nach vorne (etwa
    25-30 Grad, 1-2 Sekunden lang) und wieder zurück zur aufrechten Haltung. In der Verbeugung soll der Oberkörper,
    insbesondere der Kopf, gerade bleiben (nicht in Richtung der eigenen Füße schauen, aber auch nicht den Kopf
    hebend in Richtung des Gegenübers. Oberkörper und Kopf bilden eine Gerade).
- nr: 2
  titel: Battô Seigan
  kamae:
  - 1
  - 2
  text: 'Battô (Schwert ziehen): Den rechten Fuß nach vorne setzen, das Knie abbeugen, mit der rechten Hand Tsuka
    (Griff des Schwertes) direkt am Tsuba greifen, das Schwert in einer großen Senkrecht-Halbkreis-Bewegung herausziehen
    und zu Seigan führen. Dabei darauf achten, dass die Schneide die linke Hand nicht berührt.


    Seigan: Am Ende der Batto-Bewegung greift auch die linke Hand das Tsuka, wobei der Kleinfinger bis zum Tsuka-Ende
    (Tsuka-gashira) reicht. Gleichzeitig zieht man den linken Fuß nach und geht zu Seigan über. Die Füße sind rechts
    vorne und links hinten aber parallel gerichtet. Die Spitze des linken Fußes ist etwa in Höhe der rechten Ferse.
    Die Beine sind gerade und der Körper ist aufrecht. Das Schwert wird in der Mitte des Körpers gehalten und die
    Schwertspitze (Kissaki) in Kinn-Höhe (wenn man einen Gegner hat, dann in Höhe des gegnerischen Kinns.) Hält
    man sie noch höher, verdeckt man das Gesicht des Gegners mit dem eigenen Schwert. Die Arme dürfen nicht steif,
    sondern sollen entspannt gestreckt sein. Der rechte Zeigefinger berührt das Tsuba. Die rechte Hand greift das
    Schwert etwas von oben entspannt. Der linke Griff ist normalerweise der Haupt-griff und fester als der rechte
    Griff. Tsuka-gashira ist etwa zwei Fäuste vom Bauch entfernt.


    Batto und Seigan werden in einer Bewegung durchgeführt.'
- nr: 3
  titel: Ura-Seigan
  kamae:
  - 3
  text: Die gleiche Schwerthaltung bewahrend den linken Fuß einen Schritt nach vorne setzen. Den rechten Fuß nachziehen.
    Die Spitze des rechten Fußes ist in Höhe der linken Ferse. Die beiden Füße sind ungefähr parallel gestellt.
    Also soll die Spitze des rechten Fußes nicht nach rechts geöffnet sein.
- nr: 4
  titel: In
  kamae:
  - 4
  text: Mit dem hinteren (rechten) Fuß beginnend zurücktreten (der linke Fuß wird nachgezogen, bleibt aber vorne)
    und das Schwert an der rechten Seite aufrecht stellen. Die Schneide zeigt in Richtung des Gegners. Die greifenden
    Hände sollen weder zu hoch noch zu niedrig sein (der linke Unterarm ungefähr parallel zum Boden). Der rechte
    Ellbogen darf nicht wie beim Hasso-no-Kamae hoch gehoben werden. Der linke Fuß zeigt gerade nach vorne und der
    rechte Fuß ist schräg geöffnet.
- nr: 5
  titel: Yo
  kamae:
  - 5
  text: Den linken Fuß einen Schritt nach hinten führend das Schwert von rechts nach links verlagern, wobei das
    Schwert ganze Zeit senkrecht und die Schneide zum Gegner gerichtet ist. Diesmal zeigt der rechte Unterarm parallel
    zum Boden. Der linke Ellbogen wird nicht hoch gehoben. Der rechte Fuß zeigt gerade nach vorne und der linke
    Fuß ist schräg geöffnet.
- nr: 6
  titel: Hidari Jodan
  kamae:
  - 6
  text: Den linken Fuß einen Schritt nach vorne setzend das Schwert allein mit der linken Hand über den Kopf führen.
    Der rechte Fuß wird nachgezogen. Die rechte Hand ruht offen aber in Bereitschaft neben dem rechten Oberschenkel
    mit der Handfläche nach unten zeigend. Das Schwert steht in der Mitte über dem Körper - aber etwa 45 Grad nach
    hinten geneigt.
- nr: 7
  titel: Migi-Jodan
  kamae:
  - 7
  text: Den rechten Fuß einen Schritt nach vorne bewegend auch mit der rechten Hand das Schwert (direkt unterhalb
    des Tsuba), also mit beiden Händen, halten. Die Neigung des Schwertes ändert sich nicht.
- nr: 8
  titel: Gedan
  kamae:
  - 8
  text: Mit dem linken (hinteren) Fuß beginnend und weit zurücktretend das Schwert zu Gedan führen. Der rechte Fuß
    wird nachgezogen, bleibt aber vor dem linken. Kissaki ist etwa 5 cm tiefer als das Tsukagashira.
- nr: 9
  titel: Waki
  kamae:
  - 9
  text: Den rechten Fuß einen Schritt nach hinten führend das Schwert auf die rechte Seite führen. Kissaki zeigt
    schräg nach hinten und deutlich tiefer als die Hände. Die Schneide zeigt nach vorne. Man achte darauf, dass
    der Oberkörper aufgerichtet bleibt.
- nr: 10
  titel: Onken
  kamae:
  - 10
  text: Den linken Fuß etwas nach vorne schicken, und den Oberkörper leicht nach vorne neigend das Schwert hinter
    dem Körper verstecken. Kissaki bleibt tief. Trotz des Vorneigens muss der Oberkörper gerade bleiben. Kissaki
    darf hinten nicht zu sehr gedreht werden. Denn in diesem Fall wird es an der anderen Seite (vom Gegner aus gesehen
    rechts) sichtbar.
- nr: 11
  titel: Seigan
  kamae:
  - 11
  text: Den linken Fuß einen Schritt groß zurückführend das Schwert groß und rund nach vorne führen zur Seigan-Stellung.
- nr: 12
  titel: Ura-Waki
  kamae:
  - 12
  text: Den linken Fuß nur ein wenig nach hinten verlagernd das Schwert an die linke Seite führen. Kissaki zeigt
    etwas schräg aber ziemlich körpernah nach hinten und befindet sich in Höhe des eigenen Kopfs. Die linke Hand
    hält man direkt am Bauch. Der Blick muss nach vorne zum Gegner hin gerichtet bleiben.
- nr: 13
  titel: Chudan Kasumi
  kamae:
  - 13
  text: Den linken Fuß nach vorne setzend das Schwert auf die rechte Seite führen. Die Hände befinden sich etwa
    eine Faust breit vor dem Bauch. Kissaki ist in Augenhöhe und die Schneide ist nach außen gerichtet (nicht Richtung
    Körper). Das linke (vordere) Knie ist leicht gebeugt, der Oberkörper aber aufrecht. Das hintere Bein ist fast
    gestreckt.
- nr: 14
  titel: Jodan Kasumi
  kamae:
  - 14
  text: Den linken Fuß ein wenig nach vorne bewegen und den rechten (hinteren) Fuß leicht nachziehend hebt man das
    Schwert bis in Kopfhöhe (rechts neben den Kopf). Es ist zum Boden fast horizontal. Aber Kissaki ist etwas tiefer
    als die Hände und richtet sich gegen den Hals des vermeintlichen Gegners. Die Schneide ist oben.
- nr: 15
  titel: Tsuki
  kamae:
  - 15
  text: Den rechten Fuß weit nach vorne führend in Bauchhöhe stechen. Beide Arme sind ganz nach vorne gestreckt.
    Die Schneide wendet sich nach unten. Den linken Fuß nachziehen.
- nr: 16
  titel: Hongaku
  kamae:
  - 16
  text: Mit dem linken Fuß beginnend und den rechten Fuß folgen lassend in einer großen Bewegung zurückgehen und
    das Schwert vor der Brust horizontal halten. Die Schneide zeigt nach links. Beide Ellbogen werden in gleicher
    Höhe mit dem Schwert gehalten. Tsuka-gashira nicht zu nahe an die eigenen Brust führen. Beide Arme machen etwa
    eine Kreisform vor der Brust.
- nr: 17
  titel: Chudan Ura-gasumi
  kamae:
  - 17
  text: Den linken (hinteren) Fuß zurückziehend Hände an die linke Körperseite vor den Bauch führen. (Der rechte
    Fuß wird leicht nachgezogen.) Die Schneide bleibt nach links (nach außen) gewendet und Kissaki ist in der Augenhöhe.
    Das rechte Knie ist leicht gebeugt und das linke (hintere) Bein ist gerade.
- nr: 18
  titel: Jodan Ura-gasumi
  kamae:
  - 18
  text: Den rechten Fuß ein wenig nach vorne bewegen, und den linken Fuß leicht nachziehend das Schwert auf Kopfhöhe
    (neben den Kopf) anheben. Das Schwert zum Boden fast horizontal halten, aber Kissaki ist etwas tiefer als die
    Hände. Die Schneide zeigt nach oben und Kissaki wendet sich gegen den Hals des vermeintlichen Gegners.
- nr: 19
  titel: Tsuki
  kamae:
  - 19
  text: Den linken Fuß weit nach vorne führen, und den rechten Fuß nachziehend in Halshöhe zustechen. Beide Arme
    sind nach vorne gestreckt. Die Schneide wendet sich nach unten. Der rechte Fuß wird nachgezogen.
- nr: 20
  titel: Suriage-Men
  kamae:
  - 20
  - 21
  text: 'Suriage


    Den linken Fuß einen Schritt zurückziehend erst Kissaki senken, und danach den rechten Fuß nachziehend das Schwert
    über den Kopf hochführen. Die ganze Bewegung findet in der Körpermitte statt.


    Men (Shomen-uchi)


    Den rechten (vorderen) Fuß etwas nach vorne führend von oben nach unten mit großer Bewegung Shomen schlagen.
    Der linke (hintere) Fuß wird nachgezogen, bleibt aber hinten. Beide Füße stehen jedoch parallel. Suriage und
    Shomen-uchi werden als "Suriage-Men" als eine Bewegung durchgeführt.'
- nr: 21
  titel: Hiraki-Dachi (offenes Schwert)
  kamae:
  - 22
  text: Den rechten Fuß groß zurückziehend das Schwert auf der rechten Seite nur mit der rechten Hand greifend hängen
    lassen. Man steht mit Shizentai (natürlich aufrechte Körperhaltung). Dies ist eine ganz offene Haltung für den
    Fall, dass man umzingelt wird.
- nr: 22
  titel: Kesa-gake
  kamae:
  - 23
  text: Den rechten Fuß weit nach vorne führend schlägt man schräg von rechts oben nach links unten. Dabei greift
    auch die linke Hand das Schwert, wenn dieses mit der rechten Hand hochgehoben wird. Das rechte Knie wird gebeugt.
    Den linken Fuß etwas nachziehen. Das linke Bein ist gestreckt.
- nr: 23
  titel: Nôtô
  kamae:
  - 24
  text: Kissaki nach oben und anschließend nach hinten (aber vor dem Körper) wendend das Schwert in die Scheide
    (ersatzweise in die gekrümmten Finger der linken Hand) an der linken Körperseite führen. Die Schneide ist oben.
    Den rechten Fuß gleichzeitig mit der Nôtô-Bewegung langsam zurückziehen und gerade stehen. Die Schneide soll
    die Hand(fläche) nicht berühren.
- nr: 24
  titel: Rei
  kamae:
  - 25
  text: Das Schwert auf der linken Körperseite hängen lassen und anschließend wie am Anfang den Oberkörper vorneigen
    und wieder aufrecht stehen. Man sollte darauf achten, beim letzten Rei an der gleichen Stelle zu stehen wie
    beim ersten Rei.
odachi:
- nr: 1
  titel: 'Ichi-ban/ Ippon-me: Hitotsu-gachi (1. Hidari-gote)'
  text: 'Bis zu Nr. 5 sind die Kumidachi-Nummer und die Nummer der Kimete = Siegestreffer gleich. Deswegen kann
    man -ban oder -honme sagen. Ab Nr. 6 differenzieren sich die Nummern, weswegen nur die Kumidachi-Nummer mit
    -ban genannt wird. Z.B. enthält Nr. 6 zwei Schläge. Was in den Klammern angegeben ist, ist die Stelle des Kimete.
    Sie ist innerhalb des Odachi-Kumite durchnummeriert. Das Verb "katsu" bedeutet "siegen". "hitotsu" ist "Eins".
    Hitotsu-gachi bedeutet, dass man mit einem Schlag siegt.)


    Uchidachi: In


    Shidachi: Seigan


    (Die Angaben hinter dem Doppelpunkt sind die jeweiligen Anfangs-Kamae = Stellungen.) Mit In geht U dem S entgegen
    und legt beim Eintreten in Isshoku-sokuhatsu-no-Maai mit dem linken Fuß vorne einen Halt ein, so dass auch S
    seine Vorwärtsbewegung mit dem rechten Fuß vorne stoppt. U lauert mit großem Ki auf eine Lücke des S. Dann bewegt
    sich U plötzlich mit dem rechten Fuß nach rechts, hebt das linke Knie hoch, während er zu Dai-Jodan* geht und
    groß herunterschlägt mit dem Gefühl, das ganze Universum zu entzweien.** Eigentlich möchte U über und neben
    dem Seigan des S diesen direkt treffen, aber da er sieht, dass S sofort reagiert und sich ihm zuwendet, schlägt
    U etwas kürzer, um sich zu schützen. S sieht das Dai-Jodan des U, bleibt innerlich ruhig, geht selbst zu Jodan
    und macht - mit einem kleinen Gleitschritt rechts vorwärts - ein großes Kiriotoshi bis zum Hara des U, während
    der Schlag des U abprallt und sein Kissaki tief nach unten fällt. U gleitet nun mit dem rechten (hinteren) Fuß
    anfangend groß zurück und geht in Hidari-Jodan, um zum Gegenangriff überzugehen. S geht zwei Schritte (links
    - rechts) vor, hebt das Schwert noch einmal zu Jodan und schlägt etwas schräg das linke Kote (= Hidarigote)
    des U. Hierbei möchte U bis zum Ende kämpfen und sich nach Möglichkeit nicht schlagen lassen. Deswegen ist es
    nicht sachgemäß, wenn er das linke Kote dem S sozusagen "anbietet". U hält sich vielmehr frontal dem S gegenüber.***
    Der Oberkörper des U darf auf keinen Fall nach hinten geneigt sein. Anschließend geht S zwei Schritte (rechts
    - links) zurücktretend zu Zanshin Gedan.**** Danach führt auch U sein Schwert zu Gedan, und die beiden bewegen
    sich zu Gedan-awase in die Mitte zurück (nicht nur in die mittlere Linie, sondern in die mittlere Position zwischen
    den beiden Startpositionen).


    * Dai-Jodan ist noch größer als das normale Jodan. Dai bedeutet "groß", Jo "oben".


    ** Das wichtigste Moment des Ippon-me ist Kiriotoshi. Nach dem Halten vor S muss U sich schnell nach rechts
    bewegen und sofort schlagen. U darf nicht halbherzig schlagen, sondern wie oben erwähnt mit dem Gefühl, das
    ganze Universum zu entzweien. Deswegen lässt man bei Mutoryu sogar so tief schlagen, dass das Kissaki heftig
    den Boden schlägt. Im Shinki Toho geht man zwar nicht so weit, aber das Kissaki muss fast bis zum Boden herunter
    geführt werden. Wichtig für S ist, vor diesem großen entschiedenen Angriff des U ruhig zu bleiben und mit noch
    größerem Ki als das von U über diesen Angriff Herr zu werden. Bei diesem Kiriotoshi darf auch S sein Knie (rechts)
    etwas hochheben; das muss aber nicht sein.


    *** Da S und U sich frontal gegenüber stehen, schlägt S nicht ganz gerade, sondern etwas schräg etwa in die
    Mitte des jeweiligen Kote. Das Schwert des S muss gegenüber dem Kote, das geschlagen wird, grundsätzlich den
    Winkel von 90° haben, damit der Schnitt wirksam ist. Prinzipiell wird das Kote auf der Seite des vorderen Fußes
    von U geschlagen.


    **** Mit dem Schlag von S auf das Kote ist der Kampf beendet, so dass S nicht zusätzlich "herunterschneidet".
    S geht mit normalen zwei Schritten rechts links zurück und kommt zur Ruhe im Zanshin Gedan. Zanshin bedeutet
    die letzte Aufmerksamkeit, um nicht siegestrunken leichtsinnig zu werden. Zanshin bedeutet direkt übersetzt
    "das bleibende Herz". Auch wenn die äußere Bewegung zu Ende ist, muss das Herz noch präsent bleiben.


    Danach lösen sowohl U als auch S die Kamae, d.h. das Schwert wird von senkrecht zu waagerecht gekippt, so dass
    die beiden Schneiden sich innen gegenüber liegen. Anschließend wird das Schwert ein wenig schräg nach rechts
    unten gesenkt, bleibt dabei aber vor dem Körper. Nun gehen beide rückwärts auseinander zur Startposition, wobei
    sie mit dem linken Fuß beginnen. An der Startposition angekommen, lässt man eine Hand los, wobei das Kissaki
    etwa in der Körpermitte unten zur Ruhe kommt. Man kann während des Trainings entweder die linke oder die rechte
    Hand loslassen, aber für U, wenn er/sie die Onigote trägt, ist es natürlicher, wenn er/sie die rechte Hand loslässt
    und mit der linken Hand das Schwert hält. Man darf von Fall zu Fall und unabhängig davon, welche Hand der Gegner
    nimmt, die Seiten bestimmen bzw. wechseln. (Eine Ausnahme ist gegeben ganz am Anfang und am Ende der ganzen
    Übung sowie bei einer öffentlichen Vorführung und bei einer Prüfung. In diesen Fällen lässt man immer die rechte
    Hand los und hält das Schwert nur mit der linken Hand.) Diese Gestaltung der Schlussphase ist bei allen Kumidachi-Formen
    des O-dachi auf gleiche Weise möglich.'
- nr: 2
  titel: 'Ni-ban/ Nihon-me: Age-uke (2. Migi-gote)'
  text: 'Das Verb "ageru" bedeutet "hochheben" und "ukeru" heißt "empfangen". Age-uke bedeutet "hochhebend empfangen"
    oder "empfangend hochheben".


    Uchidachi: Seigan


    Shidachi: Gedan


    U geht mit Seigan und S mit Gedan vor. Kurz vor dem Isshoku-sokuhatsu-no-Maai, zeigt S mit dem Kissaki seinen
    Angriffswillen (mit dem linken Fuß vorne) auf das rechte Kote des U. Deswegen reagiert U dadurch, dass er sein
    Kissaki nach rechts neigt. Dabei muss sein Schwert oberhalb des Schwertes des S bleiben. S''s Kissaki kommt
    dann von unterhalb des U-Schwerts in die Mitte, so dass auch U sofort reagiert und die Mitte zu beherrschen
    sucht. S streckt seinen Oberkörper langsam nach vorne als Finte. Das Kissaki des S kommt dabei zuerst etwa bis
    zur Hälfte des Schwertes von U hinein (Sutemi-no-Maai)* und wird dann von S aufreizend langsam am Schwert von
    U entlang gleitend bis zu dessen Kissaki (Kissaki neben Kissaki) zurückgezogen. Diese Phase ist sozusagen der
    "Kampf um die Mitte". Sobald S in dieser Position (Shoshi-Kikkou-no-Maai) ruht bzw. sich sicher fühlt, sticht
    U sofort gegen den Hals von S.** S führt sein Schwert zur Aufnahme und Abwehr des stechenden Schwertes von U
    schräg nach oben, wobei das Kissaki von S nach rechts gewendet ist, damit er das Schwert des U am Tsuba gut
    abstützen kann. So kommt U durch sein nach vorne gestrecktes bzw. gestochenes Schwert in eine instabile Haltung.
    Wegen dieser instabilen Haltung und des durch die Abwehr nach oben gerutschten Schwertes geht U nun, leicht
    nach links ausweichend, zu Jodan über, um erneut S anzugreifen.*** Da aber S''s Schwertposition stabiler war,
    kann dieser schneller reagieren und - mit dem rechten Fuß vorne - U''s rechtes Kote (= Migigote) schlagen. Danach
    geht S leicht zurücktretend zu Zanshin Jodan. Danach zu Gedan-awase.


    * Sutemi-no-Maai: Sutemi bedeutet "soweit wagen, dass man bereit ist, sein Leben zu opfern". Hier verlässt man
    die Sicherheitszone und geht an den Gegner näher heran, um diesen zu provozieren. Da man tatsächlich das Leben
    verliert, wenn man nicht aufpasst, muss man ganz gesammelt und in jeder Bewegungsphase bereit sein, sofort zu
    reagieren. Shoshi-Kikkou-no-Maai: Shoshi bedeutet Leben und Tod. Kikkou heißt "gegenseitig heftig um etwas kämpfen".
    Also befinden sich U und S in diesem Maai in einer Lage, in der akut um Leben und Tod gekämpft wird. Ai-Seigan
    entspricht diesem Maai, wo beide versuchen, in die Mitte zu kommen. Es ist der Kampf um die Mitte. Dadurch sind
    beide Schwerter wie miteinander „verklebt“.


    ** Wenn S noch Anfänger ist, sollte U etwas höher (Stirnhöhe) stechen, weil S sonst im Gesicht getroffen werden
    kann.


    *** Weil U selbst die Spannung an den Schwertern löst, muss er aufpassen, dass das Schwert des S nicht auf ihn
    fällt. Das ist der Grund, warum U etwas nach links ausweicht.'
- nr: 3
  titel: 'San-ban/ Sanbon-me: Uchi-komi-Inashi (3. Migi-gote)'
  text: '"uchi-komu" bedeutet hineinschlagen. "inasu" bedeutet souverän und spielerisch leicht beherrschen. Uchidachi:
    In


    Shidachi: Seigan


    U geht mit In vor, S mit Seigan. Im Isshoku-sokuhatsu-no-Maai angekommen (links vorne), wechselt U zu Dai-Jodan,
    wobei er das rechte Knie anhebt, und schlägt groß hinein. Wichtig ist, dass S mutig vorangeht und beim großen
    Angriff des U die innere Ruhe bewahrt. Da S (der mit rechts vorne wartet) zwei Schritte (rechts - links) zurückgeht,*
    schlägt U ins Leere und braucht noch weitere zwei Ausfallschritte (links - rechts), um wieder Halt zu finden.
    S wechselt beim zweiten Rückwärtsschritt schnell zu Gedan, so dass sein Kissaki bedrohlich vor dem Hara des
    U steht. U geht zügig zwei Schritte zurück (rechts - links) und geht zu Jodan. S folgt mit zwei Schritten (links
    - rechts) dem U und schlägt etwas schräg das Migi-gote. Anschließend wechselt S – etwas zurückgehend - zu Zanshin
    Jodan. Danach Gedan-awase.


    * Beim ersten Rückwärtsschritt bleibt das Schwert des S bei Seigan, weil der Schlag des U das Tsuba treffen
    kann. Durch das gesenkte Kissaki beim zweiten Rückwärtsschritt vor dem Hara (= Mitte des Körpers) des U beherrscht
    S den U im Ganzen.'
- nr: 4
  titel: 'Yon-ban/ Yonhon-me: Kasumi-fuji (4. Migi-gote)'
  text: '"Kasumi" ist Nebel. Da der Gegner schwer einschätzen kann, wie man von diesem Kamae aus angreift, wird
    es "Nebel" genannt.


    Uchidachi: Seigan è Gedan Kasumi


    Shidachi: Gedan


    Mit Seigan anfangend geht U allmählich in Gedan, und im Isshoku-Sokuhatsu-no-Maai wechselt er zu Gedan Kasumi
    (linker Fuß vorne), während S mit Gedan vorgeht. Das Kissaki des U zeigt zuerst in die Körpermitte des S. Da
    S immer näher kommt, bewegt sich das Kissaki des U langsam nach links, um die Lücke der linken Körperseite zu
    schützen. S überschreitet Isshoku-Sokuhatsu-no-Maai, stoppt seinen Schritt rechts vorne und streckt seinen Oberkörper
    wie bei Nihon-me nach vorne und überschreitet auch das Shoshi-kikkou-no-Maai bis zum Sutemi-no-Maai. Nun liegt
    das Kissaki des S etwa in der Mitte der Schneide des U ohne Druck, wobei sein Schwert - die Schneide nach links
    - fast horizontal ist. S möchte austesten, wie U reagiert. U reagiert aber nicht und wartet aufmerksam ab, wie
    S weiter vorgehen will. S zieht das Kissaki provozierend langsam zurück bis zum Kissaki des U, wobei er den
    Druck auf das Schwert des U immer mehr erhöht. U wartet, bis dieser Druck am stärksten ist, und zieht dann sein
    Kissaki plötzlich nach links. U führt seinen rechten Fuß nach rechts, dreht das Kissaki oberhalb seines Kopfs
    nicht allzu groß um und versucht Kesagake. Sein linker Fuß wird viertelkreisförmig nach hinten nachgezogen.
    Da S nun rechts vorgleitend bis zum Hals des U Kiriotoshi ausführt und mit zwei Schritten (links - rechts) Semeage*
    macht, gleitet U mit dem hinteren (linken) Fuß beginnend zurück und geht zu Jodan, um den Gegenangriff zu ermöglichen.
    S schlägt mit dem zweiten Vorwärtsschritt das rechte Kote des U und geht etwas zurücktretend (normalerweise
    mit zwei Schritten) zu Zanshin Gedan. Danach Gedan-awase.


    * Semeage: Mit der Vorwärtsbewegung führt Shidachi sein Kissaki vom Hals zur Höhe der Nase des U, so dass dieser/diese
    zurückgedrängt wird.'
- nr: 5
  titel: 'Go-ban/ Gohon-me: Tsuki-komi Seigan-yaburi (5. Hidari-gote)'
  text: 'Uchidachi: Seigan


    Shidachi: Waki-gamae


    U geht mit Seigan voran. S fängt mit Waki-gamae an, wechselt aber früh zu Gedan und kommt ein paar Schritte
    entgegen und macht schnell ein hartes Tsuki-komi in Richtung des Halses von U; S möchte das standfeste Seigan
    des U durchbrechen. U hält sein Schwert stark entgegen, damit das Tsuki des S nicht durchkommt.* Da aber dieser
    Angriff plötzlich und stark war, muss U schnell zurückweichen, bis er wieder einigermaßen sicheren Stand hat
    (am Ende ist sein rechter Fuß hinten). Mit letzter Kraft versucht U mit einem Schritt rechts vor das Schwert
    des S nach links unten zu drücken. In diesem Augenblick lockert S seine Kraft und lässt sein Kissaki fallen,
    so dass U nach vorne fallend in eine instabile Position kommt. U versucht, sich wieder aufzurichten und wechselt
    zu Jodan. Dabei zieht er seinen rechten Fuß etwas zurück, der aber immer noch vor dem linken Fuß bleibt. S geht
    leicht nach links und schlägt das Migi-gote des U,** geht dann zu Zanshin Jodan. Danach Gedan-awase.


    * Bei diesem Tsuki-komi geht S nicht von vornherein mit gestreckten Armen. Zuerst zieht er sein Schwert vor
    die Brust, so dass das Kissaki leicht nach oben geht. In Shoshi-Kikko-no-Maai eintretend führt S Tsuki gegen
    die Mitte des Schwertes des U aus, wobei er seine Arme nach vorne streckt. Um diesen Druck aufzufangen zieht
    auch U sein Schwert vor die Brust, um dem Angriff von S Paroli zu bieten. Aber da der Druck von S sehr groß
    ist, geht U gleichzeitig zurück, um die ihm entgegenkommende Energie auffangen zu können.


    ** In Wirklichkeit kann S am Ende sofort von oben U schlagen, wenn U sich nach unten neigt, so dass dieser keine
    Zeit hat, den Fuß des S zu treffen. Aber als Kumidachi wartet S bis U sich wieder aufrecht stellt.'
- nr: 6
  titel: 'Roku-ban/ Futatsu-gachi (Futatsu-kachi): (6. Hidari-gote / 7. Migigote)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    Wie bei Ippon-me geht U mit In vor, während S mit Seigan vorgeht. Im Isshoku-Sokuhatsu-no-Maai hält U an und
    lauert kurz, geht plötzlich nach rechts und schlägt von Dai-Jodan (mit erhobenem linken Knie) aus das Shomen
    des S. S wendet sich nach links zu U, führt mit großer Bewegung Kiriotoshi aus bis zum Hara des U, und schlägt
    anschließend das Hidari-gote des U. Danach geht S das Schwert zu Seigan senkend langsam-kontrollierend zwei
    Schritte zurück. Aber bevor er zur Ruhe kommt, hat U zu In gewechselt, geht plötzlich nach links und schlägt
    Shomen (diesmal mit dem erhobenen rechten Knie). Besonders wichtig ist hier, dass U - nachdem S sein Hidari-gote
    geschlagen hat - noch einmal zum Angriff übergeht, wobei U nicht zulässt, dass S den zweiten Rückwärtsschritt
    sicher vollendet. Allerdings muss U warten, bis sich das Kissaki des S etwas entfernt, bevor er zu In wechselt.
    S muss auch zurücktretend sein Ki nach vorne schicken und bereit sein, auf den erneuten Angriff sofort zu reagieren.
    S reagiert also souverän, macht Kiriotoshi bis zum Hara des U. U gleitet mit dem linken Fuß beginnend zurück
    und wechselt zu Jodan. S schlägt das rechte Kote des U und geht zurücktretend zu Zanshin Jodan. Danach Gedan-awase.'
- nr: 7
  titel: 'Nana-ban/ Into: (8. Hidari-gote / 9. Hidari-gote)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    U geht mit In vor, S mit Seigan. Von Isshoku-Sokuhatsu-no-Maai aus schlägt U das Shomen des S; beim Schlag hebt
    U den linken Fuß und kommt links vorne zu stehen. Da aber S unerschütterlich stark sein Seigan hält (rechts
    vorne stehend), scheitert U bei dem Versuch, das Schwert des S hinunterzuschlagen. S geht kaum zurück und senkt
    sein Kissaki zu Gedan, so dass das Kissaki des S direkt vor dem Hara des U steht. U gleitet nun mit dem rechten
    (hinteren) Fuß anfangend kurz zurück und wechselt zu Jodan. S schlägt das linke Kote des U mit einem links-rechts-Vorwärtsschritt.
    Während S mit dem rechten (vorderen) Fuß beginnend zügig zwei Schritte zurückgeht, wechselt U zu In. Lauernd
    geht U mit dem rechten (hinteren) Fuß anfangend langsam zwei Schritte vor, während S dementsprechend weitere
    zwei Schritte (rechts - links) zurückgeht. U setzt nun seinen rechten (hinteren) Fuß langsam nach vorn und wechselt
    zu Seigan, während S dementsprechend mit dem rechten (vorderen) Fuß einen Schritt zurückgeht und zu In wechselt.
    Nun, entweder sofort oder nach einem Moment des Lauerns, kommt S plötzlich mit dem rechten (hinteren) Fuß nach
    vorne, schlägt mit seinem Schwert heftig etwa in die Mitte des Schwertes von U (Seigan-Yaburi) und macht sofort
    Tsuki zum Hals des U. U geht ein paar Schritte ausweichend zurück und erhebt sein Schwert mit dem linken Fuß
    vorne zu Jodan. S folgt und schlägt am Ende - mit dem rechten Fuß vorne - das linke Kote des U. Etwas zurücktretend
    wechselt er zu Zanshin In. Danach Gedan-awase.'
- nr: 8
  titel: 'Hachi-ban/ Gedan no Uchi-otoshi: (10. Hidari-gote)'
  text: 'Uchidachi: Seigan


    Shidachi: Gedan


    U geht mit Seigan vor. S kommt mit Gedan entgegen, und in Isshoku-Sokuhatsu-no-Maai führt er sein Kissaki plötzlich
    nach links (mit dem linken Fuß vorne) und bedroht das rechte Kote des U. U wendet sein Schwert etwas nach rechts,
    um diesem Angriff entgegenzuwirken. In diesem Augenblick hebt S sein Schwert zu Jodan und schlägt groß nach
    vorn; das Ziel ist der Kopf des U. Beim Schlag des S hebt U sein Kissaki, um dem Schlag entgegen zu wirken.
    Da aber das Vordringen des S sehr stark ist, geht U zügig zurück, während S, mit rechts beginnend, schnell auf
    ihn zugeht. S'' Schwert trifft das des U und schlägt dieses hinunter. U geht am Ende links vorne zu Hidari-Jodan,
    wenn er eine kleine Verfolgungslücke von S sieht. S schlägt mit linkem Fuß vorne das linke Kote des U und geht
    zurücktretend zu Zanshin Gedan. Danach Gedan-awase.'
- nr: 9
  titel: 'Kyû-ban/ Norimi: (11. Migi-gote / 12. Hidari-gote)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    U geht mit In und S mit Seigan vor. In Isshoku-Sokuhatsu-no-Maai schlägt U mit rechts vorne das Shomen des S.
    S führt Kiriotoshi aus bis zum Hara des U. U geht zwei Schritte (rechts - links) zurück und wechselt zu Jodan.
    Daraufhin schlägt S das Migi-gote des U. Mit Seigan geht S zwei Schritte zurück. U schlägt nun von Yo aus mit
    dem linken Fuß vorne das Shomen des S. S macht Kiriotoshi. Das Kissaki des S liegt nun direkt vor dem Hara des
    U. Deswegen versucht U, das Schwert des S mit dem eigenen Schwert nach links unten zu beherrschen, wobei U das
    eigene Kissaki von rechts unten nach oben über dem Schwert des S und weiter nach links unten führt (= gegen
    den Uhrzeigersinn). Gleichzeitig mit dieser Bewegung zieht U seinen linken Fuß nach hinten zurück. S dreht sein
    Kissaki im Uhrzeigersinn, weicht dem Druck des Schwertes des U und führt sein Schwert über das des U, wobei
    er mit dem linken Fuß einen Schritt vorwärts geht. U tritt zügig zwei Schritte (rechts - links) zurück, wechselt
    zu Jodan und schlägt Shomen mit dem rechten Fuß vorne. S folgt mit dem rechten Schritt U. Da U aber schnell
    zum Gegenangriff übergeht und Shomen schlägt, empfängt S dieses Schwert von oben nach links unten (Hiki-otoshi)
    und geht fließend zu Chudan-Uragasumi. Sofort führt S sein Schwert in Richtung Hara des U (Tsuki) mit dem vorderen
    (rechten) Fuß (Der linke Fuß wird nachgezogen). U weicht einen Schritt mit dem rechten Fuß zurück. U geht weiter
    zurück mit dem rechten (hinteren) Fuß (der linke Fuß wird nachgezogen) und geht zu Jodan. S schlägt das linke
    Kote des U mit links-rechts-Schritt und geht zurücktretend zu Zanshin In. Danach Gedan-awase.'
- nr: 10
  titel: 'Jû-ban/ Norimi-Hitotsu-kachi (-gachi): (13. Migi-gote)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    U geht mit In und S mit Seigan vor. U gibt vor, nach links zu gehen, aber in die Mitte zurückkommend schlägt
    er das Shomen des S mit dem rechten Fuß vorne. S führt Kiriotoshi bis zum Hals des U aus. Da U zurückgehend
    zu Jodan wechselt, verfolgt S ihn mit Semeage, schlägt sein Migi-gote und geht zurücktretend zu Zanshin Gedan.
    Danach Gedan-awase..'
- nr: 11
  titel: 'Jûichi-ban/ Gedan-no-tsuke-Chûseigan: (14. Migi-gote / 15. Hidarigote)'
  text: 'Uchidachi: Seigan


    Shidachi: Gedan


    U geht mit Seigan vor, S mit Gedan. In Isshoku-Sokuhatsu-no-Maai eintretend tut S so, als ob er das Migi-gote
    des U angreifen würde. U neigt das Kissaki etwas nach rechts, um auf diese Bewegung zu reagieren. Sein Kissaki
    bleibt aber oberhalb des Kissaki des S. S sieht nun, dass die Mitte des U frei wird und macht ein heftiges Tsukikomi
    wie bei Gohon-me. Der Unterschied zu Gohon-me ist, dass diesmal S viel näher zu U steht, wenn er mit Tsuki beginnt.
    U geht Tsuki aufnehmend zügig zurück, stoppt den Angriff des S und versucht das Schwert des S nach links unten
    zurückzuschlagen. S lässt locker und dadurch schnell das Kissaki nach rechts unten fallen, so dass U ins Leere
    schlägt und sich nach links herunterbeugt. Jetzt wechselt U sofort zu Jodan. S wartet quasi schon oben, schlägt
    das Migi-gote des U und geht zu Jodan.* Zwei Schritte zurücktretend führt S sein Schwert zu Seigan hinunter.
    Während dessen geht U zu Yo no Kamae, und bevor S richtig zu Seigan kommt, greift U wieder aus Jodan S an. S
    reagiert sofort, macht Kiriotoshi bis zum Hara und schlägt das Hidari-gote des U, und etwas zurücktretend geht
    S zu Zanshin Gedan. Danach Gedan-awase.


    * In Wirklichkeit kann S sofort von oben U schlagen, wenn U sich nach unten neigt, so dass dieser keine Zeit
    hat, den Fuß des S zu treffen. Aber als Kumidachi wartet S bis U sich wieder aufrecht stellt.


    Itto-den Shinki Toho, Chûden: Odachi'
- nr: 12
  titel: 'Jûni-ban/ Orimi: (16. Mizo''ochi / 17. Migi-gote)'
  text: 'Uchidachi: Seigan


    Shidachi: Wakigamae


    U startet in Seigan und S kommt mit Wakigamae entgegen. Von Isshoku-Sokuhatsu-no-Maai schlägt S von oben groß
    auf U herunter und kniet sofort nieder, wobei er das rechte Knie stehen lässt. Sein Kissaki zielt auf den Hals
    des U. Denn beim großen Schlag von S geht U mit dem rechten Fuß groß zurück und hält das Schwert in In-no-Kamae.
    U tut so, als ob er sich erst nach links bewegen und die rechte Seite des S angreifen möchte, kommt aber schnell
    zurück nach rechts und führt aus In direkt Kesagake aus auf die linke Schulter des S, mit dem rechten Fuß vorne.
    S steht schnell auf und sticht das Mizo''ochi (Solar plexus) des U, dessen Kote von oben beherrschend. Das ist
    der erste Teil. U geht mit dem rechten Fuß groß zurück und kehrt zu In-no-Kamae zurück, während S sich leicht
    zurückzieht und zu Seigan wechselt. U geht mit dem rechten Fuß nach vorne und schlägt das Schwert von S (linke
    Seite des S), um Seigan-Yaburi durchzuführen. Da S sein Schwert fest dagegen hält und U der Seigan-Yaburi nicht
    gelingt, führt U sein Schwert unterhalb des Schwertes von S nach links und versucht den Hara des S mit dem rechten
    Fuß vorne zu schneiden. S stellt sein Schwert – Spitze nach oben – senkrecht und empfängt das Schwert des U
    kräftig, aber etwas nach hinten führend. Sofort anschließend schlägt S das gestreckte Migi-gote des U, während
    S etwas nach links seine Position verlagert. Etwas zurücktretend (oder alternativ: vortretend) wechselt S zu
    Zanshin In. Anschließend Gedan-Awase.'
- nr: 13
  titel: 'Jûsan-ban/ Suriage: (18. Migi-gote / 19. Hidari-gote)'
  text: 'Uchi-dachi: Migi-Jôdan


    Shidachi: Seigan


    Von Isshoku-Sokuhatsu-no-Maai aus schlägt U mit dem rechten Fuß vorne das Shomen des S. S macht mit dem linken
    Fuß vorne Suriage. Da U sofort zu Jodan zurückgeht, schlägt S mit einem rechten Schritt dessen Migi-gote. S
    wechselt zu Migi-Jodan und geht mit zwei kleinen Schritten (rechts – links) zurück. U senkt sein Schwert zu
    Gedan und führt mit einem großen Linksschritt Tsuki aus zum Hara des S. S schlägt sein Schwert gegen das des
    U (mit der Schwertbewegung wie Gyaku-Kesagake), während er seinen rechten Fuß zurückzieht. U versucht sich wieder
    aufzurichten und geht zu Hidari-Jodan, während er erst den linken und danach rechten Fuß zurückzieht. S verfolgt
    die Bewegung des U erst mit einem kleinen Vorwärtsschritt mit dem linken Fuß, dann mit einem großen Schritt
    mit dem rechten Fuß und schlägt das Hidari-gote des U. S tritt etwas zurück und wechselt zu Zanshin Gedan. Danach
    Gedan-awase.'
- nr: 14
  titel: Jûyon-ban/ Wakigamae no Uchiotoshi (20. Migi-gote)
  text: 'Uchidachi: Seigan


    Shidachi: Wakigamae


    Kurz vor dem Isshoku-Sokuhatsu-no-Maai bewegt S seine linke Schulter leicht nach links, und tut so, als ob er
    die rechte Seite des U angreifen würde, wechselt aber zu Jodan, hebt sein rechtes Knie und schlägt U. U hebt
    sein Kissaki entgegen und tritt zügig zurück. Da der Schlag des S heftig ist, wird das Schwert des U nach unten
    gedrückt (etwa bis Gedan-Höhe). U geht weiter zurück und schlägt das Schwert des S nach links oben (Harai) und
    geht zu Jodan. S nutzt die Aufwärtsbewegung des Harai von U, geht zu Jodan und schlägt das Migi-gote des U.
    Dieser Schlag ist fast ganz gerade, weil das Migi-gote des U durch die Harai-Bewegung etwas nach links (von
    U her gesehen) verlagert ist. S tritt etwas zurück und wechselt zu Zanshin Gedan. Danach Gedan-awase.'
- nr: 15
  titel: Jûgo-ban/ Honshô (21. Hidari-gote)
  text: 'Uchidachi: Gedan


    Shidachi: Seigan


    Wenn beide einander entgegentreten, bewegt sich U frühzeitig etwas nach links und wechselt zu Jodan-Uragasumi.
    S bewahrt das Seigan und bewegt sich etwas nach rechts. U macht einen kleinen Linksschritt und deutet einen
    Tsuki an, dreht aber anschließend das Kissaki im Uhrzeigersinn über seinem Kopf und führt mit einem Rechtsschritt
    Kesagake aus. S lässt sich nicht durch die Tsuki-Antäuschung beirren und macht gegen Kesagake des U Kiriotoshi
    bis zum Hara des U. U geht mit dem rechten Fuß zurück und wechselt zu Hidari-Jodan. S geht mit einem links-rechts-Schritt
    vor, schlägt das Hidari-gote des U. S tritt etwas zurück und geht zu Zanshin Gedan. Danach Gedanawase.'
- nr: 16
  titel: Jûroku-ban/ Jôdan-gasumi (22. Mizo'ochi)
  text: 'Uchidachi: Jôdan-gasumi


    Shidachi: Gedan


    In das Shôshi-Kikkou-no-Maai eintretend hebt S mit dem linken Fuß vorne sein Kissaki gegen das des U. U führt
    mit einem rechten Schritt Tsuki gegen den Hals des S. Den linken Fuß zurückziehend wechselt S zu Yo und empfängt
    das Tsuki des U. Anschließend führt S mit einem links-rechts-Schritt das Kissaki zu Mizo''ochi des U, während
    er mit dem eigenen Schwert das Schwert des U bogenförmig nach außen-vorn schiebt. Da das Kissaki des S direkt
    vor dem Mizo''ochi gehalten wird, gibt U auf und zeigt sein Kissaki nach rechts unten wie beim Zurücktreten
    nach den einzelnen Übungen. S geht mit einem rechts-links-Schritt zurück und legt sein Kissaki nach rechts unten
    genau wie U (Zanshin Sasage-Dachi). Danach Gedan-awase.'
- nr: 17
  titel: Jûnana-ban/ Kobushi no Harai (23. Hidari-gote / 24. Hidari-gote)
  text: 'Uchidachi: Seigan


    Shidachi: Gedan


    In Isshoku-Sokuhatsu-no-Maai eintretend lauert S nach dem Linksschritt des U und mit dem rechten Fuß vorne gibt
    eine Finte auf das linke Kote des U. U nutzt diese Gelegenheit und macht mit einem Schritt rechts Kesagake.
    S geht mit dem rechten Fuß zurück und wechselt zu In. U geht mit dem rechten Fuß zurück und wechselt zu Hidari-Jodan.
    S schlägt mit einem Rechtsschritt das Hidari-gote des U und kehrt - mit dem rechten Fuß groß zurücktretend –
    wieder zu In zurück. Da U mit dem Rechtsschritt zu Gedan wechselt, wechselt S zu Wakigamae und greift sofort
    mit einem Rechtsschritt von oben das Men des U an. U macht Suriage, während er den rechten Fuß zurückzieht.
    Mit dem linken Fuß weiter zurücktretend schlägt U das Shomen des S, dem gegenüber S mit einem linken Vorwärtsschritt
    Suriage macht. U geht mit einem rechten Schritt weiter zurück und wechselt zu Hidari-Jodan. S schlägt das Hidari-gote
    des U mit einem rechten Schritt und - den rechten Fuß zurückziehend - wechselt er zu Zanshin In. Danach Gedan-awase.'
- nr: 18
  titel: Jûhachi-ban/ Uki (25. Hidari-gote)
  text: 'Uchidachi: Gedan


    Shidachi: Seigan


    Wie bei Honshô geht U frühzeitig etwas nach links und wechselt zu Jodan-Uragasumi. S ändert seine Position diesmal
    (im Gegensatz zu Honshô) nicht, lässt aber sein Kissaki nach rechts in die Richtung U zeigen. U macht einen
    kleinen Linksschritt und täuscht ein Tsuki vor, aber das Kissaki über seinem Kopf in Uhrzeigersinn drehend macht
    er mit einem Rechtsschritt Kesagake. S lässt sich durch die Tsuki-Finte nicht verwirren, beobachtet die Bewegung
    des U ruhig und macht Kiriotoshi gegen Kesagake. Da das Kissaki nun direkt vor dem Bauch liegt, versucht U mit
    einem rechten Rückwärtsschritt, - das eigene Schwert von links nach rechts drehend (im Uhrzeigersinn) - das
    Schwert des S nach rechts unten zu beherrschen. S dreht aber mit einem linken Schritt sein Schwert in gleiche
    Richtung etwas schneller als U und hält sein Schwert über dem des U. Diesmal dreht U sein Schwert noch einen
    Schritt (links) zurücktretend in die andere Richtung (gegen den Uhrzeigersinn), um das Schwert des S links unten
    zu beherrschen. Aber auch diesmal dreht S sein Schwert in die gleiche Richtung (von S her gesehen im Uhrzeigersinn)
    und hält sein Schwert über dem des U, wobei er mit dem rechten Fuß einen Schritt vorgeht. Nun versucht U noch
    einmal sein Schwert im Uhrzeigersinn zu drehen, um das Schwert des S rechts unten zu beherrschen, während er
    mit dem rechten Fuß einen Schritt zurückgeht. S aber verfolgt ihn mit einem linken Vorwärtsschritt, während
    er das Schwert gegen den Uhrzeigersinn dreht und auf das Schwert des U legt. Nun wechselt U mit einem kleinen
    Rückwärts-Suriashi des rechten Fußes zu Jodan, um den Gegenangriff zu starten. Aber S verfolgt ihn mit einem
    rechten Vorwärtsschritt, schlägt das Hidari-Gote des U und geht zu Zanshin Gedan zurück. Danach Gedan-awase.'
- nr: 19
  titel: 'Jûkyû-ban : Kirikaeshi (26. Migi-gote)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    In Isshoku-Sokuhatsu-no-Maai eintretend schlägt U von Dai-Jodan (großem Jodan) aus mit dem rechten Fuß vorne
    das Men des S. S bleibt mit vollem Ki mit dem rechten Fuß vorne an der Stelle, so dass U''s Schlag kürzer wird
    und auf das Schwert des S fällt. S senkt in diesem Augenblick das Kissaki zügig auf Höhe des Hara des U. Mit
    dem rechten Fuß zurücktretend wechselt U zu In. Da S mit dem Kissaki direkt vor der linken Faust des U folgt,
    geht U ein paar Schritte mit In zurück und den linken Fuß zurückziehend schlägt er das linke Yokomen des S.
    S schickt sein Schwert nach linksvorne, empfängt das schlagende Schwert des U und drängt diesen. U geht ein
    paar Schritte zurück, stoppt mit dem linken Fuß hinten die Rückwärtsbewegung, hebt mit dem eigenen Schwert das
    nachdrängende Schwert des S und versucht dieses von oben nach links unten zurückzuschlagen. In diesem Augenblick
    lässt S, sich etwas nach links bewegend, sein Schwert nach rechts unten fallen (hierbei wird die rechte Hand
    nicht gesenkt, sondern sein Schwert wird nur nach rechts unten gekippt), so dass U sich stark nach links-unten
    neigt. Wenn U sich wieder fängt und zu Migi-Jodan wechselt, schlägt S das Migi-gote des U.* Während das Schwert
    noch auf Migi-gote ruht macht S eine schiebende Vorwärtsbewegung (wie beim Aikido-Ikkyo), beginnend mit dem
    linken Fuß. Auf den Schritt nach links-vorne folgt mit dem rechten Fuß eine Rückwärts-Dreh-Bewegung im Uhrzeigersinn,
    bevor S zu Zanshin Hidari-Jôdan wechselt (mit beiden Händen). Anschließend Gedan-awase.


    *In Wirklichkeit kann S sofort von oben U schlagen, wenn U sich nach unten neigt, so dass dieser keine Zeit
    hat, den Fuß des S zu treffen. Aber als Kumidachi wartet S bis U sich wieder aufrecht stellt.'
- nr: 20
  titel: 'Nijûban : Sayû no Harai (27. Nodo / 28. Migi-gote)'
  text: 'Uchi-dachi: In


    Shidachi: Seigan


    In Shoshi-Kikko-no-Maai eintretend versucht U das Seigan-Schwert des S nach links unten herunterzuschlagen.
    S senkt das Kissaki, so dass U ins Leere schlägt und sein Kissaki links unten hält. S hebt sein Kissaki sofort
    wieder hoch und führt Tsuki in Richtung Hals des U. U geht ein paar Schritte zurück und schlägt mit dem rechten
    Fuß vorne das Migi-Do (die rechte Seite) des S. S macht einen Links-Schritt, senkt das Kissaki nach rechts vorne
    und empfängt das Schwert des U. U wechselt sofort zu Migi-Jodan; S schlägt das Migi-gote des U und wechselt
    zu Zanshin Gedan. Danach Gedan-awase.'
- nr: 21
  titel: 'Nijûichi-ban : Gyaku no Harai (29. Hidari-gote / 30. Dô)'
  text: 'Uchidachi: Yô


    Shidachi: Seigan


    U geht mit Yo vor, während S mit Seigan nach vorn kommt. In Shoshi-Kikko-no-Maai eintretend lässt U mit dem
    linken Fuß vorne sein Kissaki gerade nach vorne fallen, um das Migi-gote des S zu schneiden. S empfängt diesen
    Angriff mit Chudan-Kasumi (also mit dem linken Fuß vorne). Da dieser anschließend mit einem kleinen linken Vorwärtsschritt
    eine Tsuki-Bewegung macht, zieht U erst seinen linken Fuß und dann sofort auch den rechten Fuß zurück und geht
    zu Hidari-Jodan. Mit einem rechten Vorwärtsschritt schlägt S das Hidari-gote des U. Danach gehen S und U jeweils
    zwei Schritte zurück. S bewahrt Seigan und U wechselt zu In. Während beide sich aufeinander zu bewegen, versucht
    U aus Jodan heraus, S zu treffen. S weicht mit einem Schritt nach rechts dieser Bewegung aus, taucht leicht
    unter dem Hidari-gote des U hindurch und schneidet mit einem ziehenden Schnitt den Bauch des U von links nach
    rechts. U stoppt seine Vorwärtsbewegung und senkt den Oberkörper, bis das Schwert fast den Boden berührt. S
    verharrt nach dem Schnitt kurz in seiner Position als Zanshin Migi Harai-dachi. Anschließend Gedan-awase.


    Itto-den Shinki Toho, Okuden: Odachi'
- nr: 22
  titel: 'Nijûni-ban : Chishô (31. Migi-gote Shita = von unten)'
  text: 'Uchidachi: Gedan


    Shidachi: jizuri no Gedan


    In das Isshoku-sokuhatsu-no-Maai eintretend wechselt U zu Jodan und möchte S schlagen. S hebt sein Schwert nach
    oben, während er etwas nach links ausweicht, und schneidet das Migi-gote des U von unten. Anschließend gehen
    beide zu Zanshin Yô. Danach Gedan-awase.'
- nr: 23
  titel: 'Nijûsan-ban : Chishô no Ai-Gedan (32. Mizo''ochi)'
  text: 'Uchidachi: Gedan


    Shidachi: Gedan


    In Shôshi-kikkô-no-Maai eintretend versucht U, Gedan-zuki zu Mizo''ochi des S zu geben. S weicht etwas nach
    rechts aus und stößt, nur mit der rechten Hand das Schwert streckend, das Mizo''ochi des U. Zurücktretend geht
    er anschließend zu Zanshin Gedan. Danach Gedan-awase.'
- nr: 24
  titel: 'Nijûyon-ban : Seigan-barai (33. Hidari-gote)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    In Isshoku-Sokuhatsu-no-Maai eintretend versucht U mit einem rechten Schritt das Seigan-Schwert des S nach links
    wegzuschlagen. In diesem Augenblick zieht S seinen rechten Fuß zurück und wechselt zu In, so dass U ins Leere
    schlägt und in einen unsicheren Stand halbwegs zu Yo no Kamae zu kommen. Anschließend zieht er seinen rechten
    Fuß zurück und wechselt zu Hidari-Jodan. Mit einem rechten Schritt nach vorne schlägt S dessen Hidari-gote und
    geht zu Zanshin Chûdan-gasumi zurück. Danach Gedan-awase.'
- nr: 25
  titel: 'Nijûgo-ban : Maki-gasumi (34. Hidari-gote / 35. Migi-gote)'
  text: 'Uchidachi: Seigan è Chudan-gasumi


    Shidachi: Gedan


    U nähert sich dem S, während U von Seigan beginnend allmählich das Kissaki bis Gedan senkt und anschließend
    zu Chudan Kasumi wechselt. S kommt mit Gedan dem U näher und im Shôshi-Kikkôno-Maai hebt er sein Kissaki und
    berührt das Kissaki des U von rechts. Hierbei hat S seinen rechten Fuß vorne. U versucht mit einem Rechtsschritt
    Tsuki gegen den Hals des S. Im gleichen Augenblick geht S mit einem Linksschritt entschieden nach vorne und
    gibt mit seinem Schwert Druck auf das Schwert des U. U geht mit dem rechten Fuß zurück und wechselt zu Waki
    und anschließend zu Hidari-Jodan. S geht mit einem kleinen Schritt des rechten Fußes vor und schlägt das Hidari-gote
    des U und geht in Seigan zwei Schritte zurück (rechts – links). U wechselt zu In und versucht mit einem Rechtsschritt
    von links die rechte Seite (Do = Rumpf) des S zu schlagen. Da S dieses Schwert mit dem eigenen Schwert von oben
    beherrscht, versucht U das Schwert des S im Uhrzeigersinn quasi einzuwickeln (Makikomi). S lässt dies zu und
    zieht sein Schwert aus dieser Kreisbewegung heraus. Da U''s Schwert dadurch ins Leere geführt wird, bringt er
    sein Schwert zu Migi-Jodan und möchte noch einmal schlagen. Aber S schlägt U''s Migi-gote rechtzeitig und geht
    zu Zanshin Gedan zurück. Danach Gedan-awase.'
- nr: 26
  titel: 'Nijûroku-ban : Maki-kaeshi (36. Hidari-gote / 37. Mizo''ochi / 38.'
  text: 'Hidari-gote)


    Uchidachi: Hidari-Jôdan


    Shidachi: Seigan


    Bei der Begegnung versucht U von Hidari-Jodan aus mit dem rechten Fuß vorne das rechte Uchi-kote des S zu schneiden.
    S zieht seinen rechten Fuß zurück und wechselt von Seigan zu Waki-gamae, so dass U ins Leere schlägt. U versucht
    schnell zur stabilen Lage zurückzukommen, indem er den rechten Fuß zurückzieht und zu Hidari-Jodan wechselt.
    Mit einem rechten Vorwärtsschritt schlägt S das Hidari-gote des U, zieht sofort seinen rechten Fuß wieder zurück
    und wechselt zu Wakigamae. Während U von Hidari-Jodan zu In wechselt, wechselt S von Waki-gamae auch zu In.
    U versucht von In aus direkt das Mizo''ochi des S zu stechen. S weicht etwas nach rechts aus und führt gegen
    das Mizo''ochi des U einen Gegen-Tsuki. U versucht nun gegen den Uhrzeigersinn das Schwert des S einzuwickeln
    (Makikomi), während er ausweichend den rechten Fuß zurückzieht, weil das Kissaki des S direkt vor dem Hara ist.
    U geht zu Hidari-Jodan, um einen Gegenangriff zu starten. S lässt zuerst sein Schwert leicht „einwickeln“, hebt
    es dann zu Jodan und schlägt das Hidari-gote des U. Anschließend tritt S zu Zanshin Gedan zurück. Danach Gedan-awase.'
- nr: 27
  titel: 'Nijûnana-ban : Hikimi no Hongaku (39. Dô)'
  text: 'Uchidachi: Seigan


    Shidachi: Gedan


    In Isshoku-Sokuhatsu-no-Maai eintretend gibt S mit dem Kissaki eine Finte auf das rechte Kote des U. Da U reagiert
    und sein Kissaki nach rechts neigt, wendet S sein Kissaki wieder in die Mitte und versucht das Schwert des U
    mit einem leichten Tsuki von oben etwas nach links zu beherrschen. U hält diesen Angriff stark und versucht
    gegen die Brust des S ein Tsuki. Da S in diesem Augenblick sein Schwert nach oben führt und das Kissaki des
    U ins Leere stößt, neigt es nach links (rechts von S). S schlägt das Schwert des U heftig von oben, so dass
    der rechte Griff des U sich löst und dieser nur mit der linken Hand das Schwert an seiner linken Seite halten
    kann. S macht sofort Nuki-Do von rechts unten nach links oben. S führt sein Schwert - Schneide voran - nach
    rechts, bis das Kissaki in die Richtung des Halses des U zeigt, und wendet seine Schneide im Uhrzeigersinn,
    so dass die Schneide nach links zeigt, um mit Zanshin Hongaku zu Ende zu kommen. Danach Gedan-Awase.'
- nr: 28
  titel: 'Nijûhachi-ban : Ai-Gedan Kesa-gawashi (40. Hidari-gote)'
  text: 'Uchidachi: Gedan


    Shidachi: Gedan


    Beide treten mit Gedan vor. Ins Isshoku-Sokuhatsu-no-Maai eintretend geht U etwas nach rechts ausweichend zu
    Waki-gamae und macht mit dem rechten Fuß vorne ein großes Kesa-gake. Im gleichen Augenblick weicht auch S etwas
    nach rechts und schlägt das Hidari-gote des U von oben. (Das Hidari-gote des U verharrt nach der Kesa-gake-Bewegung
    kurz in Bauchhöhe.) Anschließend geht S zu Zanshin Chûdan-Ura-gasumi. Das Kissaki ruht dann direkt vor dem Hals
    des U.'
- nr: 29
  titel: 'Nijûkyû-ban : Hotsu (41. Mizo''ochi / 42. Dô)'
  text: 'Uchidachi: In


    Shidachi: Gedan


    Mit In in Isshoku-Sokuhatsu-no-Maai eintretend geht U nach rechts. S lässt sein Schwert wie bis jetzt und wendet
    sich absichtlich nicht dem U zu, um ihn zum Angriff zu verlocken. Da U sieht, dass die linke Seite des S frei
    ist, greift er mit einem großen Kesagake an (rechter Fuß vorne). S weicht etwas nach rechts aus und wechselt
    zu In. Da die Hände des U nach dem Kesagake gesenkt sind, legt S sein Schwert sofort auf das linke Kote des
    S mit einer Tsuki-Bewegung (den rechten Fuß vorne). U zieht seinen rechten Fuß zurück und wechselt ausweichend
    zu Waki, dem S mit einem Schritt links vor folgt. Das Schwert des S liegt ganze Zeit auf dem linken Kote des
    U. U hebt sein Schwert hoch zu Jodan; S folgt, indem er seinen rechten Fuß dem linken parallel stellt und das
    linke Kote des U oben mit dem eigenen Schwert stemmend blockiert. U versucht dieses Stemmen des S zu durchbrechen
    und S von oben zu schlagen. In diesem Augenblick senkt S seine Position und schneidet das Do des U von rechts
    oben nach links unten, wobei er mit dem linken Fuß zuerst nach links ausweicht und den rechten Fuß nachzieht.
    Anschließend geht er zu Zanshin Jôdan Ura-gasumi. Danach Gedan-awase.'
- nr: 30
  titel: 'Sanjû-ban : Uragiri (43. Men)'
  text: 'Uchidachi: Seigan


    Shidachi: Gedan


    Beide treten bis Shoshi-Kikko-no-Maai vor. S hebt das Kissaki mit starkem Ki bis Ai-Seigan. U wartet bis zum
    Ai-Seigan und gerade dann, wenn S sich durch den Gleichstand sicher zu fühlen beginnt, wendet U sein Kissaki
    halbkreisförmig von rechts nach links und – mit dem rechten Fuß vorne – schlägt den Migi-Do des S. Da S sein
    Schwert auf das des U legt und sich so verteidigt, versucht U mit dem rechten Fuß einen Schritt zurückgehend
    – den Hidari-Do des S zu schlagen, während er das Kissaki halbkreisförmig diesmal von links nach rechts wendet.
    In diesem Augenblick schlägt S nur mit der linken Hand das Men des U mit dem linken Fuß vorne. S geht mit links-rechts-Schritt
    zurück und geht zu Zanshin Hidari-Jôdan über - nur mit der linken Hand. Danach Gedan-awase.'
- nr: 31
  titel: 'Sanjûichi-ban : Kasumi-nagashi (44. Migi-gote)'
  text: 'Uchidachi: Seigan


    Shidachi: Gedan


    Genau wie bei Uragiri treten beide bis Shoshi-Kikko-no-Maai vor, und S hebt das Kissaki bis Ai-Seigan. U versucht
    das Kissaki des S etwas nach links zu drängen, dem gegenüber versucht S das Kissaki des U seinerseits nach links
    zurückzudrängen. Um dieser Gegenbewegung des S nicht zu unterliegen, versucht U erneut dagegen zu agieren, und
    zwar diesmal mit einem Tsuki zum Hals des S. S weicht etwas nach links aus und hebt das Tsuka über seinen Kopf,
    während das Kissaki rechts unten gesenkt wird, wobei beide Schwerter Kontakt halten. Hierbei lässt S das Kissaki
    des U nach rechts gleiten (fließen = Nagashi). Da U leicht in die Leere sticht, geht er etwas zurück nach links
    und wechselt zu Migi-Jodan, um S erneut zu schlagen. S schlägt in diesem Augenblick das Migi-gote des U mit
    rechtem Fuß vorne. Anschließend tritt S mit dem rechten Fuß groß zurück und wechselt zu Zanshin Jôdan-gasumi.
    Danach Gedan-awase.'
- nr: 32
  titel: 'Sanjûni-ban : Haya-Kirikaeshi (45. Migi-Dô)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    Von Isshoku-Sokuhatsu-no-Maai aus schlägt U mit rechtem Fuß vorne das Men des S. S macht Kiriotoshi bis zum
    Mizo''ochi des U. U geht mit dem rechten Fuß einen Schritt zurück und schlägt sofort mit Kesagiri zurück. S
    hebt das Kissaki etwas und empfängt das schlagende Schwert des U, wobei S sein Kissaki etwas nach vorne streckt.
    U weicht leicht nach links und wechselt nach einer Kasumi-nagashi-Bewegung zu Jodan, um S zu schlagen. S reagiert
    schnell und schlägt das Migi-Do des U von links nach rechts mit dem linken Fuß vorne. (Dieser Schnitt wird vor
    dem Migi-Do des U gestoppt, solange wir noch keinen Do-Schutz verwenden.) Anschließend tritt er mit dem linken
    Fuß etwas zurück und wechselt zu Zanshin Hongaku. Die Schwertspitze des S ist auf den Hals des U gerichtet.
    Danach Gedan-awase.


    Itto-den Shinki Toho, Jun-Menkyo: Odachi'
- nr: 33
  titel: 'Sanjûsan-ban : Junpi (46. Hidari-gote)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    In Shoshi-Kikko-no-Maai eintretend streckt U sein Kissaki gegen das des S, so dass sich beide in Ai-Seigan gegenüber
    stehen. Hierbei hat U den linken Fuß vorne. Mit einem kleinen Links-Schritt geht U vor, um die Reaktion des
    S zu prüfen. S steht mit dem rechten Fuß vorne, aber da U einen kleinen Schritt vorwärts macht, geht S auch
    mit dem hinteren (linken) Fuß etwas zurück, wobei der rechte Fuß nachgezogen wird. U glaubt hier die Schwäche
    des S zu sehen, so dass er mit dem linken Fuß vorne groß das Shomen des S schlägt. Gerade in diesem Augenblick
    macht S Shomen Kiriotoshi und stoppt sein Kissaki vor dem Hals des U. Danach geht S mit Semeage vor und schlägt
    das Hidari-gote des U, während dieser mit dem rechten Fuß anfangend zurücktritt. S geht zu Zanshin Gedan. Danach
    Gedan-awase.'
- nr: 34
  titel: 'Sanjûyon-ban : Nuke-Junpi (47. Dô / 48. Migi-gote)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    In Shoshi-Kikko-no-Maai eintretend streckt U wie beim Junpi sein Kissaki gegen das des S mit dem linken Fuß
    vorne (Ai-Seigan). Danach drückt U das Kissaki des S nach links. S reagiert gegen diesen Druck und geht etwas
    nach rechts, mit dem rechten Fuß beginnend. Hier zieht U plötzlich und überraschend das Schwert zurück zu In,
    aber gleich anschließend schlägt er das Shomen des S mit einem rechten Vorwärtsschritt. S hebt das Kissaki erst
    auch hoch, aber nach links ausweichend schlägt er das Do des U. Da U sich zuerst nach vorne unten stark neigt,
    aber wieder zu Jodan wechselt und sich dem S zuwendet, wendet sich auch S etwas nach rechts zum U und schlägt
    das Migi-gote des U. Danach mit Nadegiri* das Schwert nach rechts unten führend geht er zu Zanshin Hirakidachi,
    wobei er seinen Körper nach rechts dreht und rechts hinter dem U steht. Danach Gedanawase.


    * Nadegiri: das Verb „naderu“ bedeutet „streicheln“. „kiru“ heißt „schneiden“. Nadegiri ist „leicht streichelnd
    schneiden“.'
- nr: 35
  titel: 'Sanjûgo-ban : Tsumari (49. Nodo)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    Vom Isshoku-Sokuhatsu-no-Maai aus versucht U mit dem erhobenen linken Knie wie beim Ippon-me das Shomen des
    S zu schlagen. Da S aber unbeirrt mit Seigan vorwärts marschiert und mit dem Kissaki auf den Hals des U hinzielt,
    kann U den Schlag nicht vollenden, sondern dreht sich- dessen Kissaki ausweichend - nach links, während er sein
    Schwert links in großer Bewegung hinunter führt. S stoppt das Kissaki vor dem Hals des U, während er das Schwert
    nach rechts kippt, so dass die Schneide vor dem Hals des U ruht. Danach geht er mit rechts-links-Rückwärtsschritt
    zurück zu Zanshin Gedan. Danach Gedan-awase.'
- nr: 36
  titel: 'Sanjûroku-ban : Jûji-kuzushi (50. Migi-gote / 51 Hidari-gote)'
  text: '„Juji“ bedeutet „Kreuzform“. Dies kommt daher, dass die Zahl Zehn japanisch geschrieben (jû = 十) eine Kreuzform
    bildet. „Jûji“ ist urprünglich „Schrift oder Zeichen für Zehn“. „kuzusu“ bedeutet etwa „aus der Form bringen“.


    Uchidachi: Seigan


    Shidachi: Gedan


    In Isshoku-Sokuhatsu-no-Maai eintretend gibt S mit seinem Kissaki eine Finte gegen das rechte Kote des U. Hierbei
    hat er den linken Fuß vorne. Da U auf diese Finte reagierend sein Kissaki etwas nach rechts neigt, versucht
    S mit einem Rechtsschritt sein Kissaki von unterhalb des Kissaki von U in die Mitte zu führen, wobei er sein
    Kissaki auf Seigan-Höhe bringt. Hier bringt auch U sein Kissaki in die Mitte, um den Kampf um die Mitte nicht
    zu verlieren. Nun stehen beide mit Ai-Seigan (Seigan-Gleichstand). U geht mit dem vorderen Fuß (rechts) etwas
    vor, und S geht dementsprechend mit dem hinteren Fuß (links) etwas zurück. Hier glaubt U die Schwäche des S
    zu sehen, und mit dem hinteren Fuß (links) beginnend geht er in vier Schritten vor und führt ein scharfes Tsuki.
    Sein Ziel ist das Mizo''ochi (Solar plexus) des S. S empfängt diesen Angriff dadurch, dass er den rechten Fuß
    nach rechts hinten etwa 90° herumdreht und sein Schwert vor dem Hara horizontal hält, so dass das Schwert von
    U auf dem des S mit Druck nach unten ruht. In diesem Moment bilden die beiden Schwerter eine Kreuzform (Jû =
    +). S gibt von unten in einem kurzen Moment dem Gegendruck nach und wendet plötzlich das Kissaki rechts herum,
    so dass U sich nach vorne beugt.* U versucht sofort sich wieder aufrecht zu stellen und wechselt zu Jodan. S
    schlägt mit linkem Fuß vorne das Migi-gote des U. Danach geht U mit rechts-links-Schritt zurück und wechselt
    zu Yo, während S den linken Fuß zurückzieht, den rechten Fuß bis vor den linken Fuß nachzieht und zu Seigan
    wechselt. Anschließend schlägt U mit dem linken Fuß vorne das Shomen und S macht Kiriotoshi bis zum Mizo''ochi
    des U. U geht mit dem hinteren (rechten) Fuß zurück und wechselt zu Jodan. S schlägt das linke Kote des U und
    geht zu Zanshin Gedan. Danach Gedan-awase.


    * Das Rechts-herum-Wenden des Kissaki: Hierbei soll S den rechten Fuß, der neben dem linken Fuß Ferse zu Ferse
    steht, schräg nach rechts hinten drehen. Sein Schwert soll nicht entlang des Schwertes des U nach hinten (zur
    Spitze von U''s Schwert) geführt werden, weil es dann von U nach unten gedrückt wird. S muss sein Schwert zügig
    rechts herum drehen und über den eigenen Kopf führen und sofort das Migi-gote des U schlagen.'
- nr: 37
  titel: 'Sanjûnana-ban : Renzoku Kiriotoshi Shin (52. Migi-gote)'
  text: 'Renzoku bedeutet „hintereinander“ oder „fortführend“. Diese Kiriotoshi-Form wird genau wie Nr. 38 und Nr.
    39 eigentlich immer weiter fortgeführt, obwohl sie als Kumidachi nur zweimal praktiziert wird. Uchidachi: In


    Shidachi: Seigan


    Wie bei der Kiriotoshi-Übung schlägt U zuerst mit dem linken Fuß vorne direkt (ohne vorher zu stoppen oder sich
    nach rechts zu bewegen wie es bei Ippon-me der Fall ist) das Shomen des S, aber er hebt das linke Knie hoch
    wie beim Ippon-me. S macht Kiriotoshi bis zum Mizo''ochi des U. Danach gehen beide wieder auseinander. Danach
    kommen sie wieder in die Mitte, und U schlägt diesmal mit dem rechten Fuß vorne das Shomen des S, auch mit erhobenem
    (rechten) Knie. S macht Kiriotoshi bis zum Hals, geht mit einem Links-Rechts-Schritt vor (Seme-age) und schlägt
    das Migi-gote des U, nachdem U mit dem hinteren (linken) Fuß beginnend zurückgetreten ist und zu Jodan gewechselt
    hat. Dann geht S zu Zanshin Gedan. Danach Gedan-awase.'
- nr: 38
  titel: 'Sanjûhachi-ban : Renzoku Kiriotoshi Gyô (53. Migi-gote)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    Der Bewegungsvorgang ist gleich wie bei Nr. 37 „Shin“, aber die Bewegung ist etwas zügiger. Hier wird ein besseres
    Ma''ai-Gefühl verlangt.'
- nr: 39
  titel: 'Sanjûkyû-ban : Renzoku Kiriotoshi Sô (54. Men / 55. Men)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    Die Bewegung wird noch schneller. S schlägt und stoppt das Schwert direkt über dem Kopf des U. Auch beim zweiten
    Mal schlägt S und stoppt direkt über dem Kopf.* S geht mit Rechts-Links-Rückwärts-Schritt zu Zanshin Jôdan.
    Danach Gedan-awase.


    * Da die Bewegung schnell ist, sollte S besonders darauf achten, dass er nicht wirklich den Kopf des U trifft.'
- nr: 40
  titel: 'Yonjû-ban : Yorimi (56. Migi-gote)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    In Isshoku-Sokuhatsu-no-Maai eintretend schlägt U zuerst mit dem linken Fuß vorne das Shomen des S. S macht
    Kiriotoshi bis zum Mizo''ochi des U. U und S gehen einmal auseinander und kommen erneut näher. U schlägt von
    In aus diesmal mit dem rechten Fuß vorne das Men des S. S macht Kiriotoshi bis zum Hals des U. U geht nach rechts
    (Rechtsschritt seitwärts, der linke Fuß wird nachgezogen) und wechselt zu Jodan. S geht U folgend nach links
    (Seitwärts-Linksschritt und der rechte Fuß wird nachgezogen, aber der rechte Fuß steht vorne), schlägt das Migi-gote
    des U und geht zu Zanshin Gedan. Danach Gedan-awase.'
- nr: 41
  titel: 'Yonjûichi-ban : Koshimi (57. Ushiro-Kubi)'
  text: '(Koshi bedeutet Hüfte. Mi bedeutet Körper. Koshimi bedeutet, dass man von der Hüfte aus Kraft schöpfend
    den Körper einsetzt. Gemeint ist hier ein lebendiges Tsuki. Ushiro = Hinten, Kubi = Hals.) Uchidachi: In


    Shidachi: Seigan


    In Isshoku-Sokuhatsu-no-Maai eintretend schlägt U das Shomen des S mit dem linken Fuß vorne. S macht Kiriotoshi
    bis zum Hara des U. Danach gehen U und S einmal von einander weg zurück bis zur Anfangsposition. Sie kommen
    erneut näher und wieder schlägt U mit dem linken Fuß vorne. S macht Kiriotoshi bis zum Mizo''ochi des U mit
    dem rechten Fuß vorne. Sofort macht S Tsuki in das Mizo''ochi des U mit einem heftigen linken Schritt. Da U
    aber diesem Tsuki dadurch ausweicht, indem er einen Rechtsschritt macht und seinen Körper nach links dreht,
    macht S noch einen Schritt (rechts), und schaut mit einer Links-Drehung des Körpers zurück, wobei er nun fast
    mit Waki-gamae steht. U dreht sich nach links und versucht das Shomen des S mit einem Rechtsschritt zu schlagen.
    S macht eine schnelle Rechtsdrehung vor U (mit einem kleinen Schritt des linken Fußes und einer Rechts-Rückwärts-Drehung
    mit dem Rückwärtsschritt des rechten Fußes) und schlägt mit dem Tsuka-gashira das Mizo''ochi des U. Während
    dieser dadurch vorneigt, zieht S den linken Fuß zurück und schlägt den Nacken des U von oben. Etwas zurücktretend
    wechselt er zu Zanshin Yô. Danach Gedanawase.'
- nr: 42
  titel: 'Yonjûni-ban : Aiba (58. Migi-gote / 59. Hidari-gote)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    U geht mit In no Kamae bis zum S, während S mit Gedan unbewegt wartet. In Shôshi-Kikkô-no-Ma''ai eintretend
    geht S mit starkem Ki nach vorne, so dass U ausweichend zurücktrit. Zurücktretend macht U plötzlich Tsuki zum
    Mizo''ochi des S, während sein rechter Fuß zurückgezogen wird. S führt mit dem rechten Fuß vorne zum Mizo''ochi
    des U einen Konter-Tsuki*, so dass das Schwert des S das des U nach unten drückt. U schlägt das Schwert des
    S nach oben links, während er den linken Fuß zurückzieht, so dass er nun mit Migi-Jodan steht. S nutzt diese
    Aufwärtsbewegung aus, geht zu Jodan und schlägt mit dem linken Fuß vorne das Migi-gote des U. U zieht seinen
    rechten Fuß zurück und wechselt zu Hidari-Jôdan. S schlägt mit einem rechten Schritt das Hidari-gote des U und
    geht zu Zanshin Gedan. Diese Übung führt man nacheinander in Shin-, Gyô- und Sô-Form durch. Am Ende Gedan-awase
    .


    * Konter-Tsuki: Dieses Tsuki wird so geführt, dass das Schwert des S auf das des U gewissermaßen „aufsteigt“.
    Deswegen wird es Nori-zuki genannt. Das Verb noru bedeutet auf- oder ein-„steigen“, wie das Besteigen eines
    Pferdes oder Zugs.'
- nr: 43
  titel: 'Yonjûsan-ban : Hari-Aiba (60. Nodo)'
  text: 'Uchidachi: In


    Shidachi: Seigan


    Wie bei Nr. 42 geht U mit In no Kamae dem wartenden S entgegen. In Shôshi-Kikkô-no-Ma''ai eintretend geht S
    mit starkem Ki nach vorne, so dass U ausweichend zurückgeht. Zurücktretend macht U plötzlich Te-no-uchi, während
    sein rechter Fuß zurückgezogen wird. S schlägt das Schwert des U mit dem eigenen Schwert nach links unten, während
    er den rechten Fuß einen Schritt vorwärts bewegt. Hierbei zeigt der Schwertrücken (Mine) nach links außen. U
    geht mit dem linken Fuß zurück, führt sein Schwert unterhalb des Schwertes des S nach links, wendet sein Schwert
    und schlägt von links nach rechts das Do des S. S macht einen Schritt vorwärts mit dem linken Fuß und schlägt
    das Schwert des U etwas nach rechts unten, während er sein Schwert nach rechts etwa 180° wendet. Hier zeigt
    der Schwertrücken nach rechts außen. Sofort wendet er das Schwert nach links etwa 180° und führt das Kissaki
    zum Hals (Nodo) des U. Sein Schwertrücken zeigt wieder nach links außen. Er bewahrt sein Chûdan-gasumi als Zanshin.
    Auch diese Übung wird nacheinander in Shin, Gyo und So durchgeführt. Danach am Ende Gedan-awase.'
