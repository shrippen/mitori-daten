# Japanische Schreibweise aller Begriffe, jeder Begriff genau einmal.
#
# Aikido: Kanji aus den Listen unseres Sensei (quellen/aikido/Kyu-Techniken.doc,
# quellen/aikido/Dan-Techniken.doc), gelten als gesichert. Wo die Listen einen Begriff
# verschieden schreiben, steht hier eine Form und die Frage in KORREKTUREN.md.
#
# Schlüssel: der Name, wie er in den Programmdaten steht. Groß-/Kleinschreibung,
# Bindestriche und Längenzeichen (ô, û) spielen beim Nachschlagen keine Rolle:
# "Kiri-otoshi", "Kiriotoshi" und "kiri otoshi" finden denselben Eintrag.

