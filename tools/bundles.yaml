# Die Video-Bundles (tools/bundle.py): je DVD des Verbands eins, mit den Videos (Schlüssel wie in
# daten/videos.yaml). Ein Code gilt für genau ein Bundle.
bundles:
  - id: aikido-kyu
    titel: Aikido · alle Kyu
    videos: [aikido/k5, aikido/k4, aikido/k3, aikido/k2, aikido/k1]
  - id: aikido-dan
    titel: Aikido · alle Dan
    videos: [aikido/d1, aikido/d2, aikido/d3]
  - id: daitoryu-kyu
    titel: Daitoryu · alle Kyu
    videos: [daitoryu/k5, daitoryu/k4, daitoryu/k3, daitoryu/k2, daitoryu/k1]
  - id: daitoryu-dan
    titel: Daitoryu · alle Dan
    videos: [daitoryu/d1, daitoryu/d2, daitoryu/d3, daitoryu/ok]
  - id: shinkitoho-shoden
    titel: Shinki Toho · Suburi, Kamae, Shoden
    videos: [shinkitoho/suburi, shinkitoho/shoden]
  - id: shinkitoho-chuden
    titel: Shinki Toho · Chûden
    videos: [shinkitoho/chuden]
